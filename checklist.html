<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Checklist del Ristoratore Consapevole | SB Food Consulting</title>
    <meta name="description" content="20 domande per capire se il tuo locale e davvero sotto controllo. Checklist gratuita interattiva di SB Food Consulting.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-dark-32x32.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-dark-16x16.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" media="(prefers-color-scheme: dark)">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #37393f;
            --terracotta: #c4622d;
            --terracotta-hover: #b3561f;
            --ivory: #f5f2ee;
            --ivory-60: rgba(245,242,238,0.6);
            --surface: #ffffff;
            --green: #2d8a4e;
            --yellow: #c49a2d;
            --red: #c43d2d;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--dark);
            color: var(--dark);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ══════════════════════════════════
           SCHERMATA 1 — REGISTRAZIONE
           ══════════════════════════════════ */
        .screen { display: none; min-height: 100vh; min-height: 100dvh; }
        .screen.active { display: flex; }

        #screen-register {
            background: var(--dark);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px 24px;
            text-align: center;
        }

        .reg-logo { height: 48px; width: auto; margin-bottom: 56px; opacity: 0; animation: fadeUp .7s ease forwards; }
        .reg-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5.5vw, 3.2rem);
            font-weight: 600;
            color: #fff;
            line-height: 1.15;
            margin-bottom: 16px;
            max-width: 600px;
            opacity: 0;
            animation: fadeUp .7s ease .15s forwards;
        }
        .reg-subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            color: var(--ivory-60);
            line-height: 1.6;
            max-width: 480px;
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeUp .7s ease .3s forwards;
        }

        .reg-form {
            width: 100%;
            max-width: 380px;
            opacity: 0;
            animation: fadeUp .7s ease .45s forwards;
        }
        .reg-input {
            display: block;
            width: 100%;
            padding: 16px 20px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 12px;
            transition: border-color .25s, background .25s;
            outline: none;
        }
        .reg-input::placeholder { color: rgba(255,255,255,0.35); }
        .reg-input:focus {
            border-color: var(--terracotta);
            background: rgba(255,255,255,0.1);
        }

        .reg-btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            background: var(--terracotta);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background .25s, transform .2s;
        }
        .reg-btn:hover { background: var(--terracotta-hover); transform: translateY(-1px); }
        .reg-btn:active { transform: translateY(0); }

        /* ══════════════════════════════════
           SCHERMATA TRANSIZIONE CATEGORIA
           ══════════════════════════════════ */
        #screen-transition {
            background: var(--dark);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 40px 24px;
        }
        .trans-number {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4rem, 14vw, 8rem);
            font-weight: 700;
            color: var(--terracotta);
            line-height: 1;
            opacity: 0;
            animation: fadeUp .5s ease forwards;
        }
        .trans-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 600;
            color: #fff;
            margin-top: 12px;
            opacity: 0;
            animation: fadeUp .5s ease .1s forwards;
        }
        .trans-count {
            font-size: 0.95rem;
            color: var(--ivory-60);
            margin-top: 12px;
            opacity: 0;
            animation: fadeUp .5s ease .2s forwards;
        }

        /* ══════════════════════════════════
           SCHERMATA 2 — QUESTIONARIO
           ══════════════════════════════════ */
        #screen-quiz {
            background: var(--ivory);
            flex-direction: column;
        }

        .quiz-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: #fff;
            box-shadow: 0 1px 8px rgba(0,0,0,0.06);
        }
        .quiz-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            max-width: 800px;
            margin: 0 auto;
        }
        .quiz-logo { height: 32px; width: auto; }
        .quiz-counter {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark);
            letter-spacing: 0.02em;
        }
        .quiz-progress-wrap {
            height: 3px;
            background: rgba(55,57,63,0.08);
        }
        .quiz-progress-bar {
            height: 100%;
            background: var(--terracotta);
            width: 0%;
            transition: width .5s cubic-bezier(.4,0,.2,1);
        }

        .quiz-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 40px;
        }

        .quiz-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
            padding: 48px 40px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: cardIn .4s ease forwards;
        }

        .quiz-cat-label {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--terracotta);
            margin-bottom: 24px;
        }
        .quiz-question {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.2rem, 3vw, 1.45rem);
            font-weight: 500;
            color: var(--dark);
            line-height: 1.45;
            margin-bottom: 40px;
        }

        .quiz-answers {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .quiz-ans-btn {
            flex: 1;
            max-width: 180px;
            padding: 18px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .2s, box-shadow .25s, opacity .25s;
        }
        .quiz-ans-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .quiz-ans-btn:active { transform: translateY(0); }
        .btn-si { background: var(--terracotta); color: #fff; }
        .btn-no { background: var(--dark); color: #fff; }

        .quiz-ans-btn.selected { opacity: .7; transform: scale(.97); }

        /* ══════════════════════════════════
           SCHERMATA 3 — RISULTATO
           ══════════════════════════════════ */
        #screen-result {
            background: var(--ivory);
            flex-direction: column;
            align-items: center;
            padding: 60px 24px 80px;
        }

        .result-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .result-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 500;
            color: var(--dark);
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeUp .6s ease forwards;
        }

        .result-score {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4.5rem, 14vw, 7rem);
            font-weight: 700;
            color: var(--terracotta);
            line-height: 1;
            margin: 16px 0 4px;
            opacity: 0;
            animation: fadeUp .6s ease .1s forwards;
        }
        .result-score-sub {
            font-size: 1rem;
            color: rgba(55,57,63,0.45);
            margin-bottom: 32px;
            opacity: 0;
            animation: fadeUp .6s ease .15s forwards;
        }

        /* Barra 3 zone */
        .result-bar-wrap {
            width: 100%;
            margin-bottom: 32px;
            opacity: 0;
            animation: fadeUp .6s ease .2s forwards;
        }
        .result-bar-zones {
            display: flex;
            height: 10px;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .zone-red { flex: 8; background: var(--red); }
        .zone-yellow { flex: 6; background: var(--yellow); }
        .zone-green { flex: 6; background: var(--green); }
        .result-bar-labels {
            display: flex;
            font-size: 0.7rem;
            color: rgba(55,57,63,0.5);
        }
        .result-bar-labels span:first-child { flex: 8; text-align: left; }
        .result-bar-labels span:nth-child(2) { flex: 6; text-align: center; }
        .result-bar-labels span:last-child { flex: 6; text-align: right; }

        .result-bar-marker {
            position: relative;
            height: 0;
        }
        .result-marker-dot {
            position: absolute;
            top: -22px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--dark);
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transform: translateX(-50%);
            transition: left .8s cubic-bezier(.4,0,.2,1);
        }

        .result-message {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            text-align: left;
            margin-bottom: 40px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.05);
            opacity: 0;
            animation: fadeUp .6s ease .3s forwards;
        }
        .result-msg-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }
        .result-msg-text {
            font-size: 0.92rem;
            color: rgba(55,57,63,0.7);
            line-height: 1.65;
        }

        /* Punteggi per categoria */
        .result-cats {
            display: grid;
            gap: 12px;
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeUp .6s ease .4s forwards;
        }
        .result-cat-row {
            background: #fff;
            border-radius: 10px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 8px rgba(0,0,0,0.04);
        }
        .result-cat-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--dark);
        }
        .result-cat-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .result-cat-score {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .result-cat-dots {
            display: flex;
            gap: 4px;
        }
        .result-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(55,57,63,0.1);
        }
        .result-dot.filled { background: currentColor; }

        .result-ctas {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            opacity: 0;
            animation: fadeUp .6s ease .5s forwards;
        }
        .cta-primary {
            display: inline-block;
            padding: 18px 48px;
            background: var(--terracotta);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background .25s, transform .2s;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .cta-primary:hover { background: var(--terracotta-hover); transform: translateY(-1px); }
        .cta-outline {
            display: inline-block;
            padding: 16px 48px;
            background: transparent;
            color: var(--dark);
            border: 2px solid var(--dark);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background .25s, color .25s, transform .2s;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .cta-outline:hover { background: var(--dark); color: #fff; transform: translateY(-1px); }

        /* ══════════════════════════════════
           ANIMAZIONI
           ══════════════════════════════════ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ══════════════════════════════════
           RESPONSIVE
           ══════════════════════════════════ */
        @media (max-width: 520px) {
            .quiz-card { padding: 36px 24px; }
            .quiz-answers { gap: 12px; }
            .quiz-ans-btn { padding: 16px 16px; font-size: 1rem; }
            .result-cat-row { padding: 16px 18px; }
        }
    </style>
</head>
<body>

<!-- ═══════ SCHERMATA 1 — REGISTRAZIONE ═══════ -->
<div id="screen-register" class="screen active">
    <img src="assets/logo/logo-bianco.png" alt="SB Food Consulting" class="reg-logo">
    <h1 class="reg-title">La Checklist del Ristoratore Consapevole</h1>
    <p class="reg-subtitle">20 domande per capire se il tuo locale<br>è davvero sotto controllo</p>
    <div class="reg-form">
        <input type="text" id="reg-nome" class="reg-input" placeholder="Il tuo nome" autocomplete="given-name">
        <input type="email" id="reg-email" class="reg-input" placeholder="La tua email" autocomplete="email">
        <button onclick="iniziaChecklist()" class="reg-btn">Inizia &rarr;</button>
    </div>
</div>

<!-- ═══════ SCHERMATA TRANSIZIONE ═══════ -->
<div id="screen-transition" class="screen">
    <div class="trans-number" id="trans-number"></div>
    <div class="trans-name" id="trans-name"></div>
    <div class="trans-count" id="trans-count"></div>
</div>

<!-- ═══════ SCHERMATA 2 — QUESTIONARIO ═══════ -->
<div id="screen-quiz" class="screen">
    <div class="quiz-header">
        <div class="quiz-header-inner">
            <img src="assets/logo/logo-blu.png" alt="SB Food Consulting" class="quiz-logo">
            <span class="quiz-counter" id="quiz-counter">Domanda 1 di 20</span>
        </div>
        <div class="quiz-progress-wrap">
            <div class="quiz-progress-bar" id="quiz-progress"></div>
        </div>
    </div>
    <div class="quiz-body">
        <div class="quiz-card" id="quiz-card">
            <div class="quiz-cat-label" id="quiz-cat-label"></div>
            <div class="quiz-question" id="quiz-question"></div>
            <div class="quiz-answers">
                <button class="quiz-ans-btn btn-si" onclick="rispondi(true)">Si</button>
                <button class="quiz-ans-btn btn-no" onclick="rispondi(false)">No</button>
            </div>
        </div>
    </div>
</div>

<!-- ═══════ SCHERMATA 3 — RISULTATO ═══════ -->
<div id="screen-result" class="screen">
    <div class="result-container">
        <h2 class="result-title" id="result-title"></h2>
        <div class="result-score" id="result-score"></div>
        <div class="result-score-sub">su 20</div>

        <div class="result-bar-wrap">
            <div class="result-bar-marker">
                <div class="result-marker-dot" id="result-marker"></div>
            </div>
            <div class="result-bar-zones">
                <div class="zone-red"></div>
                <div class="zone-yellow"></div>
                <div class="zone-green"></div>
            </div>
            <div class="result-bar-labels">
                <span>0-8</span>
                <span>9-14</span>
                <span>15-20</span>
            </div>
        </div>

        <div class="result-message" id="result-message"></div>

        <div class="result-cats" id="result-cats"></div>

        <div class="result-ctas">
            <a href="academy.html" class="cta-primary">Scopri SB Food Academy &rarr;</a>
            <a href="https://calendly.com/sbfoodconsulting-info/30min" target="_blank" rel="noopener" class="cta-outline">Prenota una call gratuita &rarr;</a>
        </div>
    </div>
</div>

<script>
/* ═══════ DATI ═══════ */
var userName = '';
var userEmail = '';
var currentQuestion = 0;
var risposte = [];

var categorie = [
    { nome: 'Food Cost', num: '01', count: 4 },
    { nome: 'Personale', num: '02', count: 4 },
    { nome: 'Menu', num: '03', count: 4 },
    { nome: 'Comunicazione', num: '04', count: 4 },
    { nome: 'Numeri', num: '05', count: 4 }
];

var domande = [
    { cat: 0, catPos: 1, testo: 'Conosci il tuo food cost reale questa settimana?' },
    { cat: 0, catPos: 2, testo: 'Sai quale piatto del menu ha il margine più alto?' },
    { cat: 0, catPos: 3, testo: 'Confronti il food cost teorico con quello reale ogni mese?' },
    { cat: 0, catPos: 4, testo: 'Hai una soglia di allerta oltre la quale intervieni subito?' },
    { cat: 1, catPos: 1, testo: 'Ogni membro del team sa cosa deve fare senza che tu lo ripeta?' },
    { cat: 1, catPos: 2, testo: 'Hai un processo di onboarding per i nuovi assunti?' },
    { cat: 1, catPos: 3, testo: 'Il locale funziona correttamente anche quando non sei presente?' },
    { cat: 1, catPos: 4, testo: 'Hai standard operativi scritti che il personale segue davvero?' },
    { cat: 2, catPos: 1, testo: 'Il tuo menu ha meno di 35 voci?' },
    { cat: 2, catPos: 2, testo: 'Sai quali sono i 3 piatti più redditizi e li stai valorizzando?' },
    { cat: 2, catPos: 3, testo: 'Aggiorni il menu almeno una volta all\'anno in base ai costi?' },
    { cat: 2, catPos: 4, testo: 'Il layout del menu guida il cliente verso i piatti con margine maggiore?' },
    { cat: 3, catPos: 1, testo: 'Sai quanti clienti ti ha portato Instagram nell\'ultimo mese?' },
    { cat: 3, catPos: 2, testo: 'Hai un sistema per raccogliere le email dei tuoi clienti?' },
    { cat: 3, catPos: 3, testo: 'Le tue campagne social hanno un obiettivo misurabile?' },
    { cat: 3, catPos: 4, testo: 'Sai qual è il tuo costo di acquisizione per ogni nuovo cliente?' },
    { cat: 4, catPos: 1, testo: 'Conosci il tuo punto di pareggio mensile?' },
    { cat: 4, catPos: 2, testo: 'Sai qual è la tua percentuale di costo del lavoro sul fatturato?' },
    { cat: 4, catPos: 3, testo: 'Hai un report settimanale che leggi davvero ogni settimana?' },
    { cat: 4, catPos: 4, testo: 'Sei in grado di prevedere il fatturato del mese prossimo con margine di errore del 15%?' }
];

/* ═══════ SCHERMATA 1 — REGISTRAZIONE ═══════ */
function iniziaChecklist() {
    userName = document.getElementById('reg-nome').value.trim();
    userEmail = document.getElementById('reg-email').value.trim();

    if (!userName) { document.getElementById('reg-nome').focus(); return; }
    if (!userEmail || !userEmail.includes('@')) { document.getElementById('reg-email').focus(); return; }

    currentQuestion = 0;
    risposte = [];
    mostraTransizione(0);
}

/* Enter key avvia */
document.querySelectorAll('.reg-input').forEach(function(input) {
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') iniziaChecklist();
    });
});

/* ═══════ TRANSIZIONE CATEGORIA ═══════ */
function mostraTransizione(catIndex) {
    var cat = categorie[catIndex];

    document.getElementById('trans-number').textContent = cat.num;
    document.getElementById('trans-name').textContent = cat.nome;
    document.getElementById('trans-count').textContent = cat.count + ' domande';

    /* Reset animazioni */
    var els = document.querySelectorAll('#screen-transition .trans-number, #screen-transition .trans-name, #screen-transition .trans-count');
    els.forEach(function(el) {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
    });

    mostraSchermata('screen-transition');

    setTimeout(function() {
        mostraSchermata('screen-quiz');
        mostraDomanda();
    }, 1500);
}

/* ═══════ SCHERMATA 2 — QUESTIONARIO ═══════ */
function mostraDomanda() {
    var d = domande[currentQuestion];
    var cat = categorie[d.cat];

    document.getElementById('quiz-counter').textContent = 'Domanda ' + (currentQuestion + 1) + ' di 20';
    document.getElementById('quiz-progress').style.width = ((currentQuestion + 1) / 20 * 100) + '%';
    document.getElementById('quiz-cat-label').textContent = cat.nome.toUpperCase() + ' \u00B7 ' + d.catPos + ' di ' + cat.count;
    document.getElementById('quiz-question').textContent = d.testo;

    /* Re-trigger card animation */
    var card = document.getElementById('quiz-card');
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'cardIn .4s ease forwards';
}

function rispondi(valore) {
    risposte.push(valore ? 1 : 0);
    currentQuestion++;

    if (currentQuestion >= 20) {
        mostraRisultato();
        return;
    }

    /* Check se cambia categoria */
    var prevCat = domande[currentQuestion - 1].cat;
    var nextCat = domande[currentQuestion].cat;

    if (nextCat !== prevCat) {
        mostraTransizione(nextCat);
    } else {
        mostraDomanda();
    }
}

/* ═══════ SCHERMATA 3 — RISULTATO ═══════ */
function mostraRisultato() {
    var punteggio = risposte.reduce(function(a, b) { return a + b; }, 0);

    var punteggi = {
        food_cost: risposte.slice(0, 4).reduce(function(a, b) { return a + b; }, 0),
        personale: risposte.slice(4, 8).reduce(function(a, b) { return a + b; }, 0),
        menu: risposte.slice(8, 12).reduce(function(a, b) { return a + b; }, 0),
        comunicazione: risposte.slice(12, 16).reduce(function(a, b) { return a + b; }, 0),
        numeri: risposte.slice(16, 20).reduce(function(a, b) { return a + b; }, 0)
    };

    document.getElementById('result-title').textContent = 'Il tuo punteggio, ' + userName;
    document.getElementById('result-score').textContent = punteggio;

    /* Marker posizione */
    var pct = (punteggio / 20) * 100;
    setTimeout(function() {
        document.getElementById('result-marker').style.left = pct + '%';
    }, 100);

    /* Messaggio per fascia */
    var msgHtml = '';
    if (punteggio <= 8) {
        msgHtml = '<div class="result-msg-title">Il tuo locale ha bisogno di una ristrutturazione operativa</div>' +
                  '<div class="result-msg-text">Stai lavorando senza strumenti. Ogni giorno perdi margine senza accorgertene.</div>';
    } else if (punteggio <= 14) {
        msgHtml = '<div class="result-msg-title">Ci sono aree critiche da affrontare subito</div>' +
                  '<div class="result-msg-text">Hai delle basi ma mancano sistemi fondamentali. Il rischio è crescere in modo instabile.</div>';
    } else {
        msgHtml = '<div class="result-msg-title">Buona base — ma c\'è sempre margine di miglioramento</div>' +
                  '<div class="result-msg-text">Stai facendo le cose giuste. Con il metodo giusto puoi portare il tuo locale al livello successivo.</div>';
    }
    document.getElementById('result-message').innerHTML = msgHtml;

    /* Punteggi per categoria */
    var catData = [
        { nome: 'Food Cost', score: punteggi.food_cost },
        { nome: 'Personale', score: punteggi.personale },
        { nome: 'Menu', score: punteggi.menu },
        { nome: 'Comunicazione', score: punteggi.comunicazione },
        { nome: 'Numeri', score: punteggi.numeri }
    ];

    var catsHtml = '';
    catData.forEach(function(c) {
        var color = c.score >= 3 ? 'var(--green)' : c.score === 2 ? 'var(--yellow)' : 'var(--red)';
        var dots = '';
        for (var i = 0; i < 4; i++) {
            dots += '<div class="result-dot' + (i < c.score ? ' filled' : '') + '" style="color:' + color + ';' + (i < c.score ? 'background:' + color : '') + '"></div>';
        }
        catsHtml += '<div class="result-cat-row">' +
            '<span class="result-cat-name">' + c.nome + '</span>' +
            '<div class="result-cat-right">' +
                '<div class="result-cat-dots">' + dots + '</div>' +
                '<span class="result-cat-score" style="color:' + color + '">' + c.score + '/4</span>' +
            '</div></div>';
    });
    document.getElementById('result-cats').innerHTML = catsHtml;

    mostraSchermata('screen-result');

    /* Invio dati al backend */
    try {
        fetch('https://web-production-f3794.up.railway.app/api/checklist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nome: userName,
                email: userEmail,
                punteggio_totale: punteggio,
                punteggio_food_cost: punteggi.food_cost,
                punteggio_personale: punteggi.personale,
                punteggio_menu: punteggi.menu,
                punteggio_comunicazione: punteggi.comunicazione,
                punteggio_numeri: punteggi.numeri,
                risposte: risposte
            })
        }).then(function(r) { return r.json(); })
          .then(function(d) { console.log('Checklist salvata:', d); })
          .catch(function(e) { console.log('Backend non raggiunto:', e); });
    } catch(e) { console.log('Errore invio:', e); }
}

/* ═══════ UTILITY ═══════ */
function mostraSchermata(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
}
</script>
