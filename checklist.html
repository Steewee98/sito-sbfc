<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Checklist del Ristoratore Consapevole | SB Food Consulting</title>
    <meta name="description" content="20 domande per capire se il tuo locale e davvero sotto controllo. Checklist gratuita interattiva di SB Food Consulting.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-dark-32x32.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-dark-16x16.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" media="(prefers-color-scheme: dark)">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #37393f;
            --dark-light: #44464d;
            --terracotta: #c4622d;
            --terracotta-hover: #b3561f;
            --terracotta-glow: rgba(196,98,45,0.25);
            --ivory: #f5f2ee;
            --ivory-60: rgba(245,242,238,0.6);
            --ivory-30: rgba(245,242,238,0.3);
            --surface: #ffffff;
            --green: #2d8a4e;
            --yellow: #c49a2d;
            --red: #c43d2d;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--dark);
            color: var(--dark);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        .screen { display: none; min-height: 100vh; min-height: 100dvh; }
        .screen.active { display: flex; }

        /* ══════════════════════════════════
           SCHERMATA 1 — REGISTRAZIONE
           ══════════════════════════════════ */
        #screen-register {
            background: var(--dark);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .reg-ghost {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            font-family: 'Playfair Display', serif;
            font-size: clamp(18rem, 45vw, 32rem);
            font-weight: 700;
            color: rgba(196,98,45,0.04);
            line-height: 1;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }

        .reg-line {
            width: 48px;
            height: 2px;
            background: var(--terracotta);
            margin: 0 auto 40px;
            opacity: 0;
            animation: lineExpand .6s cubic-bezier(.4,0,.2,1) .05s forwards;
        }

        .reg-logo {
            height: 44px;
            width: auto;
            margin-bottom: 56px;
            opacity: 0;
            animation: fadeUp .7s cubic-bezier(.4,0,.2,1) forwards;
            position: relative;
        }
        .reg-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5.5vw, 3.4rem);
            font-weight: 600;
            color: #fff;
            line-height: 1.12;
            margin-bottom: 18px;
            max-width: 620px;
            position: relative;
            opacity: 0;
            animation: fadeUp .7s cubic-bezier(.4,0,.2,1) .12s forwards;
        }
        .reg-subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            color: var(--ivory-60);
            line-height: 1.65;
            max-width: 460px;
            margin-bottom: 20px;
            position: relative;
            opacity: 0;
            animation: fadeUp .7s cubic-bezier(.4,0,.2,1) .24s forwards;
        }

        .reg-form {
            width: 100%;
            max-width: 380px;
            position: relative;
        }
        .reg-field {
            opacity: 0;
            transform: translateY(20px);
        }
        .reg-field.visible {
            animation: fieldIn .5s cubic-bezier(.4,0,.2,1) forwards;
        }
        .reg-field:nth-child(1).visible { animation-delay: .4s; }
        .reg-field:nth-child(2).visible { animation-delay: .5s; }
        .reg-field:nth-child(3).visible { animation-delay: .6s; }

        .reg-input {
            display: block;
            width: 100%;
            padding: 18px 22px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 14px;
            transition: border-color .3s, background .3s, box-shadow .3s;
            outline: none;
            -webkit-appearance: none;
        }
        .reg-input::placeholder { color: rgba(255,255,255,0.3); }
        .reg-input:focus {
            border-color: var(--terracotta);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px var(--terracotta-glow);
        }

        .reg-btn {
            display: block;
            width: 100%;
            padding: 18px 24px;
            background: var(--terracotta);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            transition: background .25s, transform .2s, box-shadow .3s;
        }
        .reg-btn:hover {
            background: var(--terracotta-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(196,98,45,0.3);
        }
        .reg-btn:active { transform: translateY(0); box-shadow: none; }

        .reg-note {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.25);
            margin-top: 20px;
            opacity: 0;
            animation: fadeUp .5s ease .75s forwards;
            position: relative;
        }

        /* ══════════════════════════════════
           SCHERMATA TRANSIZIONE CATEGORIA
           ══════════════════════════════════ */
        #screen-transition {
            background: var(--dark);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 40px 24px;
            position: relative;
            overflow: hidden;
        }

        .trans-number {
            font-family: 'Playfair Display', serif;
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 700;
            color: var(--terracotta);
            line-height: 1;
            opacity: 0;
            transform: scale(0.5);
            animation: scaleIn .6s cubic-bezier(.2,.8,.3,1) forwards;
        }
        .trans-line {
            width: 40px;
            height: 2px;
            background: rgba(255,255,255,0.15);
            margin: 20px auto;
            opacity: 0;
            animation: lineExpand .4s ease .2s forwards;
        }
        .trans-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.6rem, 4.5vw, 2.4rem);
            font-weight: 600;
            color: #fff;
            opacity: 0;
            animation: fadeUp .5s cubic-bezier(.4,0,.2,1) .15s forwards;
        }
        .trans-desc {
            font-size: 0.9rem;
            color: var(--ivory-60);
            max-width: 360px;
            line-height: 1.6;
            margin-top: 12px;
            opacity: 0;
            animation: fadeUp .5s cubic-bezier(.4,0,.2,1) .25s forwards;
        }
        .trans-count {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--terracotta);
            margin-top: 24px;
            padding: 6px 16px;
            border: 1px solid rgba(196,98,45,0.3);
            border-radius: 99px;
            opacity: 0;
            animation: fadeUp .5s cubic-bezier(.4,0,.2,1) .35s forwards;
        }

        /* ══════════════════════════════════
           SCHERMATA 2 — QUESTIONARIO
           ══════════════════════════════════ */
        #screen-quiz {
            background: var(--dark);
            flex-direction: column;
        }

        .quiz-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(55,57,63,0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .quiz-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            max-width: 800px;
            margin: 0 auto;
        }
        .quiz-logo { height: 30px; width: auto; }
        .quiz-counter {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ivory-60);
            letter-spacing: 0.02em;
        }
        .quiz-progress-wrap {
            height: 3px;
            background: rgba(255,255,255,0.06);
        }
        .quiz-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--terracotta), #d4793f);
            width: 0%;
            transition: width .6s cubic-bezier(.4,0,.2,1);
            border-radius: 0 2px 2px 0;
        }

        .quiz-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 110px 24px 50px;
        }

        .quiz-card-wrapper {
            max-width: 580px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .quiz-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 48px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .quiz-card.slide-out {
            animation: slideOut .3s cubic-bezier(.4,0,1,1) forwards;
        }
        .quiz-card.slide-in {
            animation: slideIn .35s cubic-bezier(.0,0,.2,1) forwards;
        }

        /* Ghost numero domanda */
        .quiz-ghost-num {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            font-family: 'Playfair Display', serif;
            font-size: 120px;
            font-weight: 700;
            color: rgba(196,98,45,0.04);
            line-height: 1;
            pointer-events: none;
            user-select: none;
        }

        .quiz-cat-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--terracotta);
            background: rgba(196,98,45,0.12);
            padding: 7px 16px;
            border-radius: 99px;
            margin-bottom: 28px;
            position: relative;
        }
        .quiz-cat-pill-icon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quiz-cat-pill-icon svg {
            width: 12px;
            height: 12px;
            fill: var(--terracotta);
        }

        .quiz-question {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.4;
            margin-bottom: 36px;
            min-height: 2.8em;
            position: relative;
        }

        .quiz-answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .quiz-ans-btn {
            width: 100%;
            height: 64px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
            position: relative;
            overflow: hidden;
        }
        .quiz-ans-btn:hover {
            transform: scale(1.02);
        }
        .quiz-ans-btn:active {
            transform: scale(0.98);
            transition-duration: .1s;
        }

        .btn-si {
            background: linear-gradient(135deg, #c4622d, #d4733e);
            color: #fff;
        }
        .btn-si:hover { box-shadow: 0 8px 28px rgba(196,98,45,0.35); }
        .btn-no {
            background: var(--dark);
            color: #fff;
        }
        .btn-no:hover { box-shadow: 0 8px 28px rgba(55,57,63,0.35); }

        .quiz-ans-btn.pulse {
            animation: btnPulse .35s ease;
        }

        /* Pallini progresso categoria */
        .quiz-cat-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 28px;
        }
        .quiz-cat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(55,57,63,0.12);
            transition: background .3s, transform .3s;
        }
        .quiz-cat-dot.answered {
            background: var(--terracotta);
            transform: scale(1.15);
        }
        .quiz-cat-dot.current {
            background: rgba(196,98,45,0.35);
        }

        /* ══════════════════════════════════
           SCHERMATA 3 — RISULTATO
           ══════════════════════════════════ */
        #screen-result {
            background: var(--ivory);
            flex-direction: column;
            align-items: center;
            padding: 64px 24px 96px;
        }

        .result-container {
            max-width: 620px;
            width: 100%;
            text-align: center;
        }

        .result-logo {
            height: 32px;
            width: auto;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeUp .6s ease forwards;
        }

        .result-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 500;
            color: var(--dark);
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeUp .6s ease .05s forwards;
        }

        .result-score-wrap {
            position: relative;
            display: inline-block;
            margin: 12px 0 4px;
            opacity: 0;
            animation: fadeUp .6s ease .1s forwards;
        }
        .result-score {
            font-family: 'Playfair Display', serif;
            font-size: clamp(5rem, 16vw, 8rem);
            font-weight: 700;
            color: var(--terracotta);
            line-height: 1;
        }
        .result-score-sub {
            font-size: 0.95rem;
            color: rgba(55,57,63,0.4);
            margin-bottom: 36px;
            opacity: 0;
            animation: fadeUp .6s ease .15s forwards;
        }

        .result-bar-wrap {
            width: 100%;
            margin-bottom: 36px;
            opacity: 0;
            animation: fadeUp .6s ease .2s forwards;
        }
        .result-bar-zones {
            display: flex;
            height: 8px;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .zone-red { flex: 8; background: var(--red); opacity: .8; }
        .zone-yellow { flex: 6; background: var(--yellow); opacity: .8; }
        .zone-green { flex: 6; background: var(--green); opacity: .8; }
        .result-bar-labels {
            display: flex;
            font-size: 0.7rem;
            color: rgba(55,57,63,0.4);
            font-weight: 500;
        }
        .result-bar-labels span:first-child { flex: 8; text-align: left; }
        .result-bar-labels span:nth-child(2) { flex: 6; text-align: center; }
        .result-bar-labels span:last-child { flex: 6; text-align: right; }

        .result-bar-marker { position: relative; height: 0; }
        .result-marker-dot {
            position: absolute;
            top: -20px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--dark);
            border: 3px solid var(--ivory);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transform: translateX(-50%);
            left: 0%;
            transition: left 1s cubic-bezier(.4,0,.2,1);
        }

        .result-message {
            background: #fff;
            border-radius: 14px;
            padding: 32px 36px;
            text-align: left;
            margin-bottom: 40px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04), 0 4px 20px rgba(0,0,0,0.04);
            border-left: 4px solid var(--terracotta);
            opacity: 0;
            animation: fadeUp .6s ease .3s forwards;
        }
        .result-msg-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }
        .result-msg-text {
            font-size: 0.9rem;
            color: rgba(55,57,63,0.65);
            line-height: 1.7;
        }

        .result-chart { margin-bottom: 48px; }
        .result-chart-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeUp .6s ease .35s forwards;
        }

        .result-bar-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            opacity: 0;
            transform: translateX(-12px);
        }
        .result-bar-row.visible {
            animation: barRowIn .5s cubic-bezier(.4,0,.2,1) forwards;
        }

        .result-bar-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--dark);
            width: 120px;
            flex-shrink: 0;
            text-align: right;
        }
        .result-bar-track {
            flex: 1;
            height: 32px;
            background: rgba(55,57,63,0.05);
            border-radius: 8px;
            overflow: hidden;
        }
        .result-bar-fill {
            height: 100%;
            border-radius: 8px;
            width: 0%;
            transition: width .8s cubic-bezier(.4,0,.2,1);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            min-width: 40px;
        }
        .result-bar-val {
            font-size: 0.78rem;
            font-weight: 700;
            color: #fff;
        }

        .result-ctas {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            opacity: 0;
            animation: fadeUp .6s ease .7s forwards;
        }
        .cta-primary {
            display: inline-block;
            padding: 18px 48px;
            background: var(--terracotta);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background .25s, transform .2s, box-shadow .3s;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .cta-primary:hover {
            background: var(--terracotta-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(196,98,45,0.3);
        }
        .cta-outline {
            display: inline-block;
            padding: 16px 48px;
            background: transparent;
            color: var(--dark);
            border: 2px solid rgba(55,57,63,0.2);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background .25s, color .25s, border-color .25s, transform .2s;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .cta-outline:hover {
            background: var(--dark);
            color: #fff;
            border-color: var(--dark);
            transform: translateY(-2px);
        }
        .cta-pdf {
            background: none;
            border: 2px solid var(--terracotta);
            color: var(--terracotta);
            padding: 14px 28px;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .25s, color .25s, transform .2s;
            width: 100%;
            max-width: 400px;
        }
        .cta-pdf:hover {
            background: var(--terracotta);
            color: #fff;
            transform: translateY(-1px);
        }

        /* ══════════════════════════════════
           ANIMAZIONI
           ══════════════════════════════════ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fieldIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes lineExpand {
            from { opacity: 0; transform: scaleX(0); }
            to   { opacity: 1; transform: scaleX(1); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.4); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes slideOut {
            from { opacity: 1; transform: translateX(0); }
            to   { opacity: 0; transform: translateX(-60px); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes btnPulse {
            0%   { transform: scale(1); }
            40%  { transform: scale(.96); }
            100% { transform: scale(1); }
        }
        @keyframes barRowIn {
            from { opacity: 0; transform: translateX(-12px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* ══════════════════════════════════
           RESPONSIVE
           ══════════════════════════════════ */
        @media (max-width: 520px) {
            .quiz-card { padding: 36px 24px; }
            .quiz-question { font-size: 20px; }
            .quiz-ans-btn { height: 58px; font-size: 15px; }
            .quiz-ghost-num { font-size: 90px; }
            .result-bar-label { width: 90px; font-size: 0.75rem; }
            .result-bar-track { height: 28px; }
            .result-message { padding: 24px 20px; }
            .reg-ghost { font-size: clamp(12rem, 45vw, 18rem); }
        }
    </style>
</head>
<body>

<!-- ═══════ SCHERMATA 1 — REGISTRAZIONE ═══════ -->
<div id="screen-register" class="screen active">
    <div class="reg-ghost" aria-hidden="true">20</div>
    <img src="assets/logo/logo-bianco.png" alt="SB Food Consulting" class="reg-logo">
    <h1 class="reg-title">La Checklist del<br>Ristoratore Consapevole</h1>
    <p class="reg-subtitle">20 domande per capire se il tuo locale<br>è davvero sotto controllo</p>
    <div class="reg-line"></div>
    <div class="reg-form" id="reg-form">
        <div class="reg-field">
            <input type="text" id="reg-nome" class="reg-input" placeholder="Il tuo nome" autocomplete="given-name">
        </div>
        <div class="reg-field">
            <input type="email" id="reg-email" class="reg-input" placeholder="La tua email" autocomplete="email">
        </div>
        <div class="reg-field">
            <button onclick="iniziaChecklist()" class="reg-btn">Inizia &rarr;</button>
        </div>
    </div>
    <p class="reg-note">Gratuito. 5 minuti. Risultato immediato.</p>
</div>

<!-- ═══════ SCHERMATA TRANSIZIONE ═══════ -->
<div id="screen-transition" class="screen">
    <div class="trans-number" id="trans-number"></div>
    <div class="trans-line"></div>
    <div class="trans-name" id="trans-name"></div>
    <div class="trans-desc" id="trans-desc"></div>
    <div class="trans-count" id="trans-count"></div>
</div>

<!-- ═══════ SCHERMATA 2 — QUESTIONARIO ═══════ -->
<div id="screen-quiz" class="screen">
    <div class="quiz-header">
        <div class="quiz-header-inner">
            <img src="assets/logo/logo-bianco.png" alt="SB Food Consulting" class="quiz-logo">
            <span class="quiz-counter" id="quiz-counter">Domanda 1 di 20</span>
        </div>
        <div class="quiz-progress-wrap">
            <div class="quiz-progress-bar" id="quiz-progress"></div>
        </div>
    </div>
    <div class="quiz-body">
        <div class="quiz-card-wrapper">
            <div class="quiz-card" id="quiz-card">
                <div class="quiz-ghost-num" id="quiz-ghost-num" aria-hidden="true"></div>
                <div class="quiz-cat-pill" id="quiz-cat-pill">
                    <span class="quiz-cat-pill-icon"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/></svg></span>
                    <span id="quiz-cat-label"></span>
                </div>
                <div class="quiz-question" id="quiz-question"></div>
                <div class="quiz-answers">
                    <button class="quiz-ans-btn btn-si" id="btn-si" onclick="rispondi(true)">Si</button>
                    <button class="quiz-ans-btn btn-no" id="btn-no" onclick="rispondi(false)">No</button>
                </div>
                <div class="quiz-cat-dots" id="quiz-cat-dots"></div>
            </div>
        </div>
    </div>
</div>

<!-- ═══════ SCHERMATA 3 — RISULTATO ═══════ -->
<div id="screen-result" class="screen">
    <div class="result-container">
        <img src="assets/logo/logo-blu.png" alt="SB Food Consulting" class="result-logo">
        <h2 class="result-title" id="result-title"></h2>
        <div class="result-score-wrap">
            <div class="result-score" id="result-score">0</div>
        </div>
        <div class="result-score-sub">su 20</div>

        <div class="result-bar-wrap">
            <div class="result-bar-marker">
                <div class="result-marker-dot" id="result-marker"></div>
            </div>
            <div class="result-bar-zones">
                <div class="zone-red"></div>
                <div class="zone-yellow"></div>
                <div class="zone-green"></div>
            </div>
            <div class="result-bar-labels">
                <span>0 — 8</span>
                <span>9 — 14</span>
                <span>15 — 20</span>
            </div>
        </div>

        <div class="result-message" id="result-message"></div>

        <div class="result-chart">
            <div class="result-chart-title">I tuoi risultati per area</div>
            <div id="result-bars"></div>
        </div>

        <div class="result-ctas">
            <a href="academy.html" class="cta-primary">Scopri SB Food Academy &rarr;</a>
            <a href="https://calendly.com/sbfoodconsulting-info/30min" target="_blank" rel="noopener" class="cta-outline">Prenota una call gratuita &rarr;</a>
            <button onclick="scaricaResoconto()" class="cta-pdf">&darr; Scarica il tuo resoconto PDF</button>
        </div>
    </div>
</div>

<script>
/* ═══════ DATI GLOBALI ═══════ */
var userName = '';
var userEmail = '';
var currentQuestion = 0;
var risposte = [];
var punteggioFinale = 0;
var punteggiCategorie = {};
var isAnimating = false;

var catIcons = [
    '<svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2.5a1 1 0 110 2 1 1 0 010-2zM6.5 7h1V6h1v1h1v1h-1v3.5h-1V8h-1V7z"/></svg>',
    '<svg viewBox="0 0 16 16"><circle cx="8" cy="4" r="2.5"/><path d="M3.5 14v-2.5A3.5 3.5 0 017 8h2a3.5 3.5 0 013.5 3.5V14"/></svg>',
    '<svg viewBox="0 0 16 16"><path d="M2 3h12v10H2V3zm2 2v2h8V5H4zm0 4v2h5V9H4z"/></svg>',
    '<svg viewBox="0 0 16 16"><path d="M14 10l-4 4-2-2-4 4H2V2h12v8zM5 5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/></svg>',
    '<svg viewBox="0 0 16 16"><path d="M2 13V5l4-3h4l4 3v8H2zm5-8v3h2V5H7zm-3 5h8v1H4v-1z"/></svg>'
];

var categorie = [
    { nome: 'Food Cost', num: '01', count: 4, desc: 'Quanto conosci davvero i costi del tuo locale? Margini, sprechi, e numeri che contano.' },
    { nome: 'Personale', num: '02', count: 4, desc: 'Il tuo team lavora con autonomia e standard chiari, o dipende tutto da te?' },
    { nome: 'Menu', num: '03', count: 4, desc: 'Il menu \u00e8 il tuo strumento di vendita pi\u00f9 potente. Lo stai usando bene?' },
    { nome: 'Comunicazione', num: '04', count: 4, desc: 'Marketing e comunicazione: stai investendo o stai solo spendendo?' },
    { nome: 'Numeri', num: '05', count: 4, desc: 'I numeri che ogni ristoratore dovrebbe conoscere a memoria.' }
];

var catBgColors = ['rgba(196,98,45,0.85)', 'rgba(107,92,231,0.85)', 'rgba(45,138,78,0.85)', 'rgba(196,154,45,0.85)', 'rgba(58,123,213,0.85)'];

var domande = [
    { cat: 0, catPos: 1, testo: 'Conosci il tuo food cost reale questa settimana?' },
    { cat: 0, catPos: 2, testo: 'Sai quale piatto del menu ha il margine pi\u00f9 alto?' },
    { cat: 0, catPos: 3, testo: 'Confronti il food cost teorico con quello reale ogni mese?' },
    { cat: 0, catPos: 4, testo: 'Hai una soglia di allerta oltre la quale intervieni subito?' },
    { cat: 1, catPos: 1, testo: 'Ogni membro del team sa cosa deve fare senza che tu lo ripeta?' },
    { cat: 1, catPos: 2, testo: 'Hai un processo di onboarding per i nuovi assunti?' },
    { cat: 1, catPos: 3, testo: 'Il locale funziona correttamente anche quando non sei presente?' },
    { cat: 1, catPos: 4, testo: 'Hai standard operativi scritti che il personale segue davvero?' },
    { cat: 2, catPos: 1, testo: 'Il tuo menu ha meno di 35 voci?' },
    { cat: 2, catPos: 2, testo: 'Sai quali sono i 3 piatti pi\u00f9 redditizi e li stai valorizzando?' },
    { cat: 2, catPos: 3, testo: 'Aggiorni il menu almeno una volta all\'anno in base ai costi?' },
    { cat: 2, catPos: 4, testo: 'Il layout del menu guida il cliente verso i piatti con margine maggiore?' },
    { cat: 3, catPos: 1, testo: 'Sai quanti clienti ti ha portato Instagram nell\'ultimo mese?' },
    { cat: 3, catPos: 2, testo: 'Hai un sistema per raccogliere le email dei tuoi clienti?' },
    { cat: 3, catPos: 3, testo: 'Le tue campagne social hanno un obiettivo misurabile?' },
    { cat: 3, catPos: 4, testo: 'Sai qual \u00e8 il tuo costo di acquisizione per ogni nuovo cliente?' },
    { cat: 4, catPos: 1, testo: 'Conosci il tuo punto di pareggio mensile?' },
    { cat: 4, catPos: 2, testo: 'Sai qual \u00e8 la tua percentuale di costo del lavoro sul fatturato?' },
    { cat: 4, catPos: 3, testo: 'Hai un report settimanale che leggi davvero ogni settimana?' },
    { cat: 4, catPos: 4, testo: 'Sei in grado di prevedere il fatturato del mese prossimo con margine di errore del 15%?' }
];

/* ═══════ SCHERMATA 1 — REGISTRAZIONE ═══════ */
setTimeout(function() {
    document.querySelectorAll('.reg-field').forEach(function(el) {
        el.classList.add('visible');
    });
}, 100);

function iniziaChecklist() {
    userName = document.getElementById('reg-nome').value.trim();
    userEmail = document.getElementById('reg-email').value.trim();

    if (!userName) { document.getElementById('reg-nome').focus(); return; }
    if (!userEmail || !userEmail.includes('@')) { document.getElementById('reg-email').focus(); return; }

    currentQuestion = 0;
    risposte = [];
    mostraTransizione(0);
}

document.querySelectorAll('.reg-input').forEach(function(input) {
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') iniziaChecklist();
    });
});

/* ═══════ TRANSIZIONE CATEGORIA ═══════ */
function mostraTransizione(catIndex) {
    var cat = categorie[catIndex];

    document.getElementById('trans-number').textContent = cat.num;
    document.getElementById('trans-name').textContent = cat.nome;
    document.getElementById('trans-desc').textContent = cat.desc;
    document.getElementById('trans-count').textContent = cat.count + ' domande';

    var transEls = document.querySelectorAll('#screen-transition .trans-number, #screen-transition .trans-line, #screen-transition .trans-name, #screen-transition .trans-desc, #screen-transition .trans-count');
    transEls.forEach(function(el) {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
    });

    mostraSchermata('screen-transition');

    setTimeout(function() {
        mostraSchermata('screen-quiz');
        mostraDomanda(true);
    }, 1800);
}

/* ═══════ SCHERMATA 2 — QUESTIONARIO ═══════ */
function mostraDomanda(isFirst) {
    var d = domande[currentQuestion];
    var cat = categorie[d.cat];

    document.getElementById('quiz-counter').textContent = 'Domanda ' + (currentQuestion + 1) + ' di 20';
    document.getElementById('quiz-progress').style.width = ((currentQuestion + 1) / 20 * 100) + '%';
    document.getElementById('quiz-cat-label').textContent = cat.nome.toUpperCase() + ' \u00B7 ' + d.catPos + ' di ' + cat.count;
    document.getElementById('quiz-question').textContent = d.testo;
    document.getElementById('quiz-ghost-num').textContent = (currentQuestion + 1);

    /* Icona categoria nella pill */
    var iconEl = document.querySelector('.quiz-cat-pill-icon');
    if (iconEl) iconEl.innerHTML = catIcons[d.cat];

    /* Pallini progresso categoria */
    var dotsHtml = '';
    var catStart = d.cat * 4;
    for (var i = 0; i < cat.count; i++) {
        var qIdx = catStart + i;
        var cls = 'quiz-cat-dot';
        if (qIdx < currentQuestion) cls += ' answered';
        else if (qIdx === currentQuestion) cls += ' current';
        dotsHtml += '<div class="' + cls + '"></div>';
    }
    document.getElementById('quiz-cat-dots').innerHTML = dotsHtml;

    var card = document.getElementById('quiz-card');
    card.classList.remove('slide-out', 'slide-in');

    if (!isFirst) {
        card.classList.add('slide-in');
    } else {
        card.style.animation = 'none';
        card.offsetHeight;
        card.classList.add('slide-in');
    }

    isAnimating = false;
}

function rispondi(valore) {
    if (isAnimating) return;
    isAnimating = true;

    var btnId = valore ? 'btn-si' : 'btn-no';
    var btn = document.getElementById(btnId);
    btn.classList.remove('pulse');
    btn.offsetHeight;
    btn.classList.add('pulse');

    var d = domande[currentQuestion];
    risposte.push({
        domanda: d.testo,
        risposta: valore,
        categoria: categorie[d.cat].nome.toUpperCase()
    });
    currentQuestion++;

    if (currentQuestion >= 20) {
        setTimeout(function() { mostraRisultato(); }, 300);
        return;
    }

    var card = document.getElementById('quiz-card');
    card.classList.add('slide-out');

    var prevCat = domande[currentQuestion - 1].cat;
    var nextCat = domande[currentQuestion].cat;

    setTimeout(function() {
        card.classList.remove('slide-out');
        if (nextCat !== prevCat) {
            mostraTransizione(nextCat);
        } else {
            mostraDomanda(false);
        }
    }, 280);
}

/* ═══════ SCHERMATA 3 — RISULTATO ═══════ */
function mostraRisultato() {
    var scores = risposte.map(function(r) { return r.risposta ? 1 : 0; });
    punteggioFinale = scores.reduce(function(a, b) { return a + b; }, 0);

    punteggiCategorie = {
        food_cost: scores.slice(0, 4).reduce(function(a, b) { return a + b; }, 0),
        personale: scores.slice(4, 8).reduce(function(a, b) { return a + b; }, 0),
        menu: scores.slice(8, 12).reduce(function(a, b) { return a + b; }, 0),
        comunicazione: scores.slice(12, 16).reduce(function(a, b) { return a + b; }, 0),
        numeri: scores.slice(16, 20).reduce(function(a, b) { return a + b; }, 0)
    };

    document.getElementById('result-title').textContent = 'Il tuo punteggio, ' + userName;
    mostraSchermata('screen-result');

    var scoreEl = document.getElementById('result-score');
    animateCount(scoreEl, 0, punteggioFinale, 1200);

    var pct = (punteggioFinale / 20) * 100;
    setTimeout(function() {
        document.getElementById('result-marker').style.left = pct + '%';
    }, 200);

    var msgHtml = '';
    if (punteggioFinale <= 8) {
        msgHtml = '<div class="result-msg-title">Il tuo locale ha bisogno di una ristrutturazione operativa</div>' +
                  '<div class="result-msg-text">Stai lavorando senza strumenti. Ogni giorno perdi margine senza accorgertene.</div>';
    } else if (punteggioFinale <= 14) {
        msgHtml = '<div class="result-msg-title">Ci sono aree critiche da affrontare subito</div>' +
                  '<div class="result-msg-text">Hai delle basi ma mancano sistemi fondamentali. Il rischio \u00e8 crescere in modo instabile.</div>';
    } else {
        msgHtml = '<div class="result-msg-title">Buona base \u2014 ma c\u2019\u00e8 sempre margine di miglioramento</div>' +
                  '<div class="result-msg-text">Stai facendo le cose giuste. Con il metodo giusto puoi portare il tuo locale al livello successivo.</div>';
    }
    document.getElementById('result-message').innerHTML = msgHtml;

    var barData = [
        { nome: 'Food Cost', score: punteggiCategorie.food_cost, idx: 0 },
        { nome: 'Personale', score: punteggiCategorie.personale, idx: 1 },
        { nome: 'Menu', score: punteggiCategorie.menu, idx: 2 },
        { nome: 'Comunicazione', score: punteggiCategorie.comunicazione, idx: 3 },
        { nome: 'Numeri', score: punteggiCategorie.numeri, idx: 4 }
    ];

    var barsHtml = '';
    barData.forEach(function(b) {
        barsHtml += '<div class="result-bar-row" id="bar-row-' + b.idx + '">' +
            '<span class="result-bar-label">' + b.nome + '</span>' +
            '<div class="result-bar-track">' +
                '<div class="result-bar-fill" id="bar-fill-' + b.idx + '" style="background:' + catBgColors[b.idx] + '">' +
                    '<span class="result-bar-val">' + b.score + '/4</span>' +
                '</div>' +
            '</div>' +
        '</div>';
    });
    document.getElementById('result-bars').innerHTML = barsHtml;

    barData.forEach(function(b, i) {
        setTimeout(function() {
            var row = document.getElementById('bar-row-' + b.idx);
            row.classList.add('visible');
            setTimeout(function() {
                var fill = document.getElementById('bar-fill-' + b.idx);
                fill.style.width = Math.max((b.score / 4) * 100, 12) + '%';
            }, 100);
        }, 450 + (i * 120));
    });

    /* Invio dati al backend */
    var scoresOnly = risposte.map(function(r) { return r.risposta ? 1 : 0; });
    try {
        fetch('https://web-production-f3794.up.railway.app/api/checklist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nome: userName,
                email: userEmail,
                punteggio_totale: punteggioFinale,
                punteggio_food_cost: punteggiCategorie.food_cost,
                punteggio_personale: punteggiCategorie.personale,
                punteggio_menu: punteggiCategorie.menu,
                punteggio_comunicazione: punteggiCategorie.comunicazione,
                punteggio_numeri: punteggiCategorie.numeri,
                risposte: scoresOnly
            })
        }).then(function(r) { return r.json(); })
          .then(function(d) { console.log('Checklist salvata:', d); })
          .catch(function(e) { console.log('Backend non raggiunto:', e); });
    } catch(e) { console.log('Errore invio:', e); }
}

/* ═══════ PDF RESOCONTO ═══════ */
function scaricaResoconto() {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF();

    var SCURO = [55, 57, 63];
    var TERRACOTTA = [196, 98, 45];
    var AVORIO = [245, 242, 238];
    var nome = userName;
    var punteggio = punteggioFinale;
    var punteggi = punteggiCategorie;

    /* HEADER */
    doc.setFillColor(SCURO[0], SCURO[1], SCURO[2]);
    doc.rect(0, 0, 210, 45, 'F');

    doc.setTextColor(TERRACOTTA[0], TERRACOTTA[1], TERRACOTTA[2]);
    doc.setFontSize(10);
    doc.setFont('helvetica', 'bold');
    doc.text('SB FOOD CONSULTING', 20, 18);

    doc.setTextColor(255, 255, 255);
    doc.setFontSize(18);
    doc.setFont('helvetica', 'bold');
    doc.text('La tua Checklist Operativa', 20, 30);

    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(200, 195, 188);
    doc.text(new Date().toLocaleDateString('it-IT'), 20, 40);

    /* NOME E PUNTEGGIO */
    doc.setTextColor(SCURO[0], SCURO[1], SCURO[2]);
    doc.setFontSize(14);
    doc.setFont('helvetica', 'bold');
    doc.text('Risultato di ' + nome, 20, 65);

    doc.setFontSize(32);
    doc.setTextColor(TERRACOTTA[0], TERRACOTTA[1], TERRACOTTA[2]);
    doc.text(punteggio + '/20', 20, 82);

    /* Fascia risultato */
    doc.setFontSize(11);
    doc.setTextColor(SCURO[0], SCURO[1], SCURO[2]);
    var fasciaText = '';
    if (punteggio <= 8)
        fasciaText = 'Il tuo locale ha bisogno di una ristrutturazione operativa';
    else if (punteggio <= 14)
        fasciaText = 'Ci sono aree critiche da affrontare subito';
    else
        fasciaText = 'Buona base \u2014 ma c\'\u00e8 sempre margine di miglioramento';

    var fasciaLines = doc.splitTextToSize(fasciaText, 170);
    doc.text(fasciaLines, 20, 95);

    /* PUNTEGGI PER CATEGORIA */
    doc.setFillColor(AVORIO[0], AVORIO[1], AVORIO[2]);
    doc.rect(15, 108, 180, 8, 'F');
    doc.setTextColor(TERRACOTTA[0], TERRACOTTA[1], TERRACOTTA[2]);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.text('PUNTEGGI PER AREA', 20, 114);

    var catList = [
        { nome: 'Food Cost', score: punteggi.food_cost },
        { nome: 'Personale', score: punteggi.personale },
        { nome: 'Menu', score: punteggi.menu },
        { nome: 'Comunicazione', score: punteggi.comunicazione },
        { nome: 'Numeri', score: punteggi.numeri }
    ];

    var y = 125;
    catList.forEach(function(cat) {
        doc.setTextColor(SCURO[0], SCURO[1], SCURO[2]);
        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.text(cat.nome, 20, y);

        doc.setFillColor(220, 215, 210);
        doc.rect(70, y - 5, 100, 6, 'F');

        var width = (cat.score / 4) * 100;
        var color = cat.score >= 3 ? [46, 204, 113] :
                    cat.score >= 2 ? [212, 167, 23] :
                    [204, 68, 68];
        doc.setFillColor(color[0], color[1], color[2]);
        doc.rect(70, y - 5, width, 6, 'F');

        doc.setTextColor(SCURO[0], SCURO[1], SCURO[2]);
        doc.setFont('helvetica', 'bold');
        doc.text(cat.score + '/4', 178, y);

        y += 14;
    });

    /* DETTAGLIO RISPOSTE */
    y += 6;
    doc.setFillColor(AVORIO[0], AVORIO[1], AVORIO[2]);
    doc.rect(15, y, 180, 8, 'F');
    doc.setTextColor(TERRACOTTA[0], TERRACOTTA[1], TERRACOTTA[2]);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.text('DETTAGLIO RISPOSTE', 20, y + 6);
    y += 16;

    risposte.forEach(function(r, i) {
        if (y > 270) {
            doc.addPage();
            y = 20;
        }
        var colore = r.risposta ? [46, 204, 113] : [204, 68, 68];
        doc.setFillColor(colore[0], colore[1], colore[2]);
        doc.circle(22, y - 1, 2, 'F');

        doc.setTextColor(SCURO[0], SCURO[1], SCURO[2]);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        var lines = doc.splitTextToSize((i + 1) + '. ' + r.domanda, 155);
        doc.text(lines, 28, y);

        doc.setFont('helvetica', 'bold');
        doc.setTextColor(colore[0], colore[1], colore[2]);
        doc.text(r.risposta ? 'SI' : 'NO', 188, y);

        y += lines.length * 5 + 4;
    });

    /* FOOTER */
    var pageCount = doc.internal.getNumberOfPages();
    for (var p = 1; p <= pageCount; p++) {
        doc.setPage(p);
        doc.setFillColor(SCURO[0], SCURO[1], SCURO[2]);
        doc.rect(0, 282, 210, 15, 'F');
        doc.setTextColor(TERRACOTTA[0], TERRACOTTA[1], TERRACOTTA[2]);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'bold');
        doc.text('SB Food Consulting', 20, 291);
        doc.setTextColor(200, 195, 188);
        doc.setFont('helvetica', 'normal');
        doc.text('sbfoodconsulting.com  |  info@sbfoodconsulting.com', 70, 291);
    }

    doc.save('checklist-sbfood-' + nome.toLowerCase().replace(/\s/g, '-') + '.pdf');
}

/* ═══════ UTILITY ═══════ */
function mostraSchermata(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
}

function animateCount(el, from, to, duration) {
    var startTime = null;
    function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(from + (to - from) * eased);
        if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}
</script>
