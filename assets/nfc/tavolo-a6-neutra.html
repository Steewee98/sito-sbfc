<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>SBFC — Placca da tavolo neutra (A6), prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PROTOTIPO — placca da tavolo NEUTRA, grafica SB Food.
     È la versione economica: tutte uguali, stampate a lotti.
     Niente nome del locale, niente foto, niente numero di tavolo:
     l'unica cosa che cambia da un pezzo all'altro è il CODICE
     (qui A7F3), stampato sotto il QR. Il codice si abbina al locale
     quando la vendiamo, dal gestionale: il QR non va mai ristampato.
     Stessa grammatica della famiglia (Playfair + Inter, cornice
     sottile, «Appoggia qui»), due materiali:
       .chiara  plexiglas bianco 2 mm
       .scura   plexiglas nero 5 mm (QR su riquadro chiaro)
     ============================================================ */
  :root{ --w:105mm; --h:148mm; --bleed:3mm; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#d9d4ca; font-family:'Inter',sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body{ display:flex; flex-wrap:wrap; gap:14mm; justify-content:center; align-items:center; min-height:100vh; padding:12mm; }
  .placca{ position:relative; width:calc(var(--w) + var(--bleed)*2); height:calc(var(--h) + var(--bleed)*2); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.22); }
  .chiara{ background:#f5f2ee; color:#2b2d31; --acc:#c4622d; --soft:#6b6560; }
  .scura{ background:#161719; color:#f5f2ee; --acc:#d9773f; --soft:#a8a29a; }
  .frame{ position:absolute; top:calc(var(--bleed) + 4mm); left:calc(var(--bleed) + 4mm); right:calc(var(--bleed) + 4mm); bottom:calc(var(--bleed) + 4mm); border:.5pt solid var(--acc); }
  .safe{ position:absolute; top:var(--bleed); left:var(--bleed); width:var(--w); height:var(--h); padding:13mm 12mm 11mm; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .benvenuto{ font-weight:600; font-size:5.6pt; letter-spacing:2.6pt; text-transform:uppercase; color:var(--acc); text-indent:2.6pt; }
  .titolo{ font-family:'Playfair Display',serif; font-style:italic; font-weight:500; font-size:30pt; line-height:1; margin-top:3mm; }
  .bersaglio{ margin-top:9mm; display:flex; flex-direction:column; align-items:center; gap:3mm; }
  .anello{ width:30mm; height:30mm; border-radius:50%; border:.8pt solid var(--acc); display:flex; align-items:center; justify-content:center; position:relative; }
  .anello::before{ content:""; position:absolute; inset:2.2mm; border-radius:50%; border:.4pt dashed var(--acc); opacity:.5; }
  .icona{ width:14mm; color:var(--acc); margin-left:1mm; }
  .icona svg{ display:block; width:100%; height:auto; }
  .bersaglio span{ font-weight:600; font-size:5.4pt; letter-spacing:2pt; text-transform:uppercase; color:var(--acc); text-indent:2pt; }
  .dice{ font-family:'Playfair Display',serif; font-weight:600; font-size:14pt; line-height:1.22; margin-top:7mm; }
  .cosa{ margin-top:4mm; font-weight:600; font-size:8pt; }
  .cosa i{ font-style:normal; color:var(--acc); padding:0 1mm; }
  .lingue{ margin-top:1.6mm; font-size:5.2pt; letter-spacing:1.6pt; color:var(--soft); font-weight:500; }
  .piede{ margin-top:auto; width:100%; display:flex; align-items:flex-end; justify-content:space-between; padding-top:5mm; }
  .qr{ display:flex; align-items:flex-end; gap:2.6mm; text-align:left; }
  .qr-fondo{ width:17mm; height:17mm; padding:1.2mm; background:#fbfbf9; color:#2b2d31; border-radius:.6mm; }
  .qr-fondo svg{ display:block; width:100%; height:100%; }
  .qr-t small{ display:block; font-size:5.4pt; color:var(--soft); }
  .qr-t code{ display:block; font-family:'Inter',sans-serif; font-weight:600; font-size:7pt; letter-spacing:1.4pt; margin-top:.8mm; }
  .logo{ height:9mm; width:auto; display:block; }
  /* sul chiaro lo stesso logo bianco, portato al colore dell'inchiostro */
  .chiara .logo{ filter:brightness(0); opacity:.82; }
  @page{ size:111mm 154mm; margin:0; }
  @media print{ html,body{ background:#fff; } body{ display:block; padding:0; min-height:0; } .placca{ box-shadow:none; break-after:page; } }
</style>
</head>
