<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>SBFC — Tag menù al tavolo (A6)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     SB FOOD CONSULTING — Tag menù al tavolo
     A6 (105 x 148 mm) + bleed 3 mm.

     Non è la placca recensioni con un'altra frase: è un altro
     oggetto. Quella è un cartello che parla al cliente che se ne
     va — testo centrato, tono cerimonioso. Questo deve sembrare
     LA CARTA: fondo chiaro, il titolo in corsivo come si intesta un
     menù scritto a mano, le portate incolonnate a sinistra con i
     filetti, e il tap in fondo come si fa con le istruzioni.
     Famiglia: stessi due caratteri, stessi tre colori, stesso gesto.
     ============================================================ */
  :root{
    --ink:#2b2d31; --ink-soft:#6b6560; --cream:#f5f2ee;
    --accent:#c4622d; --line:rgba(43,45,49,.22);
    --w:105mm; --h:148mm; --bleed:3mm;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background:#e2ddd5; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .placca{
    position:relative;
    width:calc(var(--w) + var(--bleed)*2);
    height:calc(var(--h) + var(--bleed)*2);
    background:
      linear-gradient(180deg, rgba(249,246,241,.30) 0%, rgba(245,241,235,.22) 60%, rgba(241,236,229,.42) 100%),
      url('bg-chiari/bg-2.png') center/cover no-repeat;
    color:var(--ink); overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.18);
  }

  /* l'intestazione: corsivo, come si scrive in testa a una carta */
  .testata{ text-align:center; padding-top:2mm; }
  .testata .parola{
    font-family:'Playfair Display',serif; font-style:italic; font-weight:500;
    font-size:22pt; letter-spacing:.2pt; color:var(--ink); line-height:1.1;
  }
  .testata .filo{ width:16mm; height:0.5pt; background:var(--accent);
    margin:5mm auto 0; opacity:.9; }

  .safe{
    position:absolute; top:var(--bleed); left:var(--bleed);
    width:var(--w); height:var(--h);
    padding:14mm 13mm 9mm;
    display:flex; flex-direction:column;
  }

  /* le portate: incolonnate, con il filetto che porta al numero —
     la forma di una carta, non di un cartello */
  .portate{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:5.4mm; }
  .voce{ display:flex; align-items:baseline; gap:2.5mm; }
  .voce .nome{
    font-family:'Playfair Display',serif; font-weight:500;
    font-size:13.5pt; letter-spacing:.2pt; color:var(--ink); white-space:nowrap;
  }
  .voce .filetto{ flex:1 1 auto; height:0.5pt; background:var(--line); transform:translateY(-1mm); }
  .voce .num{
    font-family:'Inter',sans-serif; font-weight:500; font-size:7pt;
    letter-spacing:1.4pt; color:var(--ink-soft);
  }

  /* il tap in fondo, come si mettono le istruzioni */
  .istruzione{
    display:flex; align-items:center; gap:4.5mm;
    border-top:0.5pt solid var(--line); padding-top:6mm; margin-top:6mm;
  }
  .istruzione .icona{ width:12mm; flex:none; color:var(--accent); }
  .istruzione .icona svg{ display:block; width:100%; height:auto; }
  .istruzione .dice{ flex:1 1 auto; }
  .istruzione .dice b{
    display:block; font-family:'Playfair Display',serif; font-weight:600;
    font-size:11.5pt; line-height:1.25; color:var(--ink);
  }
  .istruzione .dice span{
    display:block; margin-top:1.4mm;
    font-family:'Playfair Display',serif; font-style:italic; font-weight:400;
    font-size:9pt; color:var(--accent);
  }

  .firma{
    margin-top:6mm; text-align:center;
    font-family:'Inter',sans-serif; font-weight:600;
    font-size:5.6pt; letter-spacing:2.2pt; text-transform:uppercase;
    color:var(--ink-soft); opacity:.75;
  }

  @page{ size:111mm 154mm; margin:0; }
  @media print{ html,body{ background:#fff; } .placca{ box-shadow:none; } }
</style>
</head>
<body>

  <div class="placca">
    <div class="safe">
      <div class="testata">
        <div class="parola">Il nostro menù</div>
        <div class="filo"></div>
      </div>

      <div class="portate">
        <div class="voce"><span class="nome">Antipasti</span><span class="filetto"></span><span class="num">01</span></div>
        <div class="voce"><span class="nome">Primi</span><span class="filetto"></span><span class="num">02</span></div>
        <div class="voce"><span class="nome">Secondi</span><span class="filetto"></span><span class="num">03</span></div>
        <div class="voce"><span class="nome">Contorni</span><span class="filetto"></span><span class="num">04</span></div>
        <div class="voce"><span class="nome">Dolci</span><span class="filetto"></span><span class="num">05</span></div>
        <div class="voce"><span class="nome">Vini e bevande</span><span class="filetto"></span><span class="num">06</span></div>
      </div>

      <div class="istruzione">
        <div class="icona" aria-hidden="true">
          <svg viewBox="0 0 100 92" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="20" y="24" width="42" height="60" rx="8"/>
            <line x1="34" y1="32" x2="48" y2="32"/>
            <circle cx="41" cy="78" r="2.6" fill="currentColor" stroke="none"/>
            <path d="M64.8 22.4 A 9 9 0 0 1 68.3 33.4"/>
            <path d="M69.0 15.6 A 17 17 0 0 1 75.8 36.4"/>
            <path d="M73.3 8.8 A 25 25 0 0 1 83.2 39.4"/>
          </svg>
        </div>
        <div class="dice">
          <b>Avvicina il telefono<br>per aprire la carta</b>
          <span>Allergeni e prezzi sempre aggiornati</span>
        </div>
      </div>

      <div class="firma">SB Food Consulting</div>
    </div>
  </div>

</body>
</html>
