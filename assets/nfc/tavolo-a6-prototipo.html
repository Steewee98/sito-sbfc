<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>SBFC — Placca da tavolo (A6), prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PROTOTIPO — la placca da tavolo, un solo pezzo per tavolo.
     A6 (105 x 148 mm) + 3 mm di abbondanza, due materiali:
       .bianca  plexiglas bianco 2 mm  → si stampa l'inchiostro scuro
       .nera    plexiglas nero 5 mm    → si stampano bianco e ottone;
                il QR sta su un riquadro chiaro perché non tutti i
                telefoni leggono i QR invertiti.
     L'arco è lo stesso delle foto del menù digitale: chi tocca la
     placca ritrova la stessa forma sul telefono. Il tag NFC va
     incollato dietro, al centro dell'arco.
     Una pagina per placca in stampa (111 x 154 mm).
     ============================================================ */
  :root{ --w:105mm; --h:148mm; --bleed:3mm; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#d9d4ca; font-family:'Hanken Grotesk',sans-serif;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body{ display:flex; flex-wrap:wrap; gap:14mm; justify-content:center; align-items:center; min-height:100vh; padding:12mm; }
  .placca{ position:relative; width:calc(var(--w) + var(--bleed)*2); height:calc(var(--h) + var(--bleed)*2);
    overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.22); }
  .bianca{ --fondo:#fbfbf9; background:#fbfbf9; color:#15241d; --acc:#c2412a; --ott:#8d6d31; --soft:#5b675f; }
  .nera{ --fondo:#0d0d0d; background:#0d0d0d; color:#eee7d8; --acc:#e0603f; --ott:#cdac68; --soft:#a39c8e; }
  .safe{ position:absolute; top:var(--bleed); left:var(--bleed); width:var(--w); height:var(--h);
    padding:11mm 11mm 9mm; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .testa .osteria{ font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:6pt; letter-spacing:3.2pt; text-transform:uppercase; color:var(--ott); text-indent:3.2pt; }
  .testa .nome{ font-family:'Gloock',serif; font-size:25pt; line-height:1; margin-top:1.6mm; color:var(--acc); }
  /* l'arco: una finestra romana tracciata a filo, il tag sta dietro */
  .arco{ position:relative; width:52mm; height:57mm; margin-top:6mm; border:.6pt solid var(--ott);
    border-radius:26mm 26mm 1mm 1mm; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3.5mm; }
  .arco::before{ content:""; position:absolute; inset:1.6mm; border:.3pt solid var(--ott); opacity:.45;
    border-radius:24.4mm 24.4mm .6mm .6mm; }
  .arco{ justify-content:flex-end; padding-bottom:5mm; }
  .foto{ position:absolute; inset:1.6mm; border-radius:24.4mm 24.4mm .6mm .6mm; overflow:hidden; }
  .foto img{ width:100%; height:100%; object-fit:cover; display:block; }
  .foto::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 45%, rgba(0,0,0,.55) 100%); }
  .arco::before{ z-index:1; }
  .bersaglio{ position:relative; z-index:2; width:19mm; height:19mm; border-radius:50%; background:var(--fondo);
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 .6pt var(--ott), 0 0 0 1.8mm color-mix(in srgb, var(--fondo) 45%, transparent); }
  .icona{ width:11mm; color:var(--acc); margin-left:1mm; }
  .icona svg{ display:block; width:100%; height:auto; }
  .qui{ font-family:'Gloock',serif; font-size:13pt; line-height:1.2; margin-top:6mm; }
  .cosa{ margin-top:3mm; font-weight:600; font-size:8.6pt; letter-spacing:.3pt; }
  .cosa span{ color:var(--ott); padding:0 1mm; }
  .lingue{ margin-top:1.8mm; font-family:'IBM Plex Mono',monospace; font-size:5.4pt; letter-spacing:1.6pt; color:var(--soft); margin-bottom:5mm; }
  .piede{ margin-top:auto; width:100%; display:flex; align-items:flex-end; justify-content:space-between;
    border-top:.4pt solid color-mix(in srgb, currentColor 22%, transparent); padding-top:4.5mm; }
  .qr{ display:flex; align-items:flex-end; gap:2.6mm; text-align:left; }
  .qr-fondo{ width:19mm; height:19mm; padding:1.3mm; background:#fbfbf9; color:#15241d; border-radius:.6mm; }
  .qr-fondo svg{ display:block; width:100%; height:100%; }
  .qr small{ font-size:5.6pt; color:var(--soft); max-width:13mm; line-height:1.3; padding-bottom:.6mm; }
  .tavolo{ text-align:right; line-height:1; }
  .tavolo small{ display:block; font-family:'IBM Plex Mono',monospace; font-size:5.4pt; letter-spacing:2pt; text-transform:uppercase; color:var(--ott); margin-bottom:1mm; }
  .tavolo b{ font-family:'Gloock',serif; font-weight:400; font-size:30pt; }
  .firma{ position:absolute; left:0; right:0; bottom:calc(var(--bleed) + 3.2mm); text-align:center;
    font-weight:600; font-size:4.4pt; letter-spacing:1.8pt; text-transform:uppercase; color:var(--soft); opacity:.7; }
  @page{ size:111mm 154mm; margin:0; }
  @media print{ html,body{ background:#fff; } body{ display:block; padding:0; min-height:0; }
    .placca{ box-shadow:none; page-break-after:always; break-after:page; } }
</style>
