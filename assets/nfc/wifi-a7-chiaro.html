<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>SBFC — Placchetta Wi-Fi (A7 orizzontale) — chiara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     SB FOOD CONSULTING — Placchetta Wi-Fi — VERSIONE CHIARA
     105 x 74 mm ORIZZONTALE + bleed 3 mm.

     Terzo oggetto, terza forma. La placca recensioni è un cartello
     verticale che parla; il menù è una carta. Questa è un'etichetta
     di servizio: sdraiata, il simbolo grande a sinistra che si legge
     da due metri, il testo secco a destra, e una riga vuota dove il
     locale scrive il nome della rete a mano o in stampa.
     Niente corsivi cerimoniosi: qui si dà un'informazione.
     ============================================================ */
  :root{
    --dark:#f5f2ee; --ivory:#2b2d31; --accent:#a8511f;
    --w:105mm; --h:74mm; --bleed:3mm;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background:#e2ddd5; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .placca{
    position:relative;
    width:calc(var(--w) + var(--bleed)*2);
    height:calc(var(--h) + var(--bleed)*2);
    background:
      linear-gradient(120deg, rgba(249,246,241,.30) 0%, rgba(245,241,235,.20) 55%, rgba(241,236,229,.44) 100%),
      url('bg-chiari/bg-2.png') center/cover no-repeat;
    color:var(--ivory); overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.35);
  }
  .placca::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(rgba(0,0,0,.012) 1px, transparent 1px);
    background-size:3px 3px; mix-blend-mode:multiply; opacity:.5; }

  .safe{
    position:absolute; top:var(--bleed); left:var(--bleed);
    width:var(--w); height:var(--h);
    padding:8mm 9mm;
    display:flex; align-items:center; gap:7mm;
  }

  /* il simbolo grande: è lui a dire cos'è, prima di qualsiasi parola.
     Sotto, la dicitura che dice dove sta il tag: stessa di menù e placca,
     così chi ne ha già usata una riconosce il gesto. */
  .segnale{ flex:none; position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:3.4mm; }
  .segnale .onde{ width:22mm; color:var(--accent); }
  .segnale .onde svg{ display:block; width:100%; height:auto; }
  .segnale .qui{
    font-family:'Inter',sans-serif; font-weight:600;
    font-size:5pt; letter-spacing:1.9pt; text-transform:uppercase;
    color:var(--accent); text-indent:1.9pt; white-space:nowrap;
  }

  .divisorio{ width:0.5pt; align-self:stretch; background:var(--accent); opacity:.55;
    position:relative; z-index:2; }

  .testo{ flex:1 1 auto; position:relative; z-index:2; }
  .occhiello{
    font-family:'Inter',sans-serif; font-weight:600;
    font-size:6pt; letter-spacing:2.6pt; text-transform:uppercase;
    color:var(--accent);
  }
  .titolo{
    font-family:'Playfair Display',serif; font-weight:600;
    font-size:15.5pt; line-height:1.2; letter-spacing:.2pt;
    color:var(--ivory); margin-top:3mm;
  }
  .come{
    font-family:'Inter',sans-serif; font-weight:400;
    font-size:7.6pt; line-height:1.5; color:var(--ivory); opacity:.72;
    margin-top:3.4mm;
  }
  /* la riga della rete: il locale ci scrive il nome, o la fa stampare */
  .rete{ margin-top:5mm; max-width:52mm; }
  .rete .et{
    font-family:'Inter',sans-serif; font-weight:600;
    font-size:5.4pt; letter-spacing:1.8pt; text-transform:uppercase;
    color:var(--ivory); opacity:.55;
  }
  .rete .riga{ margin-top:2.4mm; height:0.5pt; background:var(--ivory); opacity:.35; }

  .firma{
    position:absolute; right:9mm; bottom:5mm; z-index:2;
    font-family:'Inter',sans-serif; font-weight:600;
    font-size:5.2pt; letter-spacing:2pt; text-transform:uppercase;
    color:var(--accent); opacity:.85;
  }

  @page{ size:111mm 80mm; margin:0; }
  @media print{ html,body{ background:#fff; } .placca{ box-shadow:none; } }
</style>
</head>
<body>

  <div class="placca">
    <div class="safe">
      <div class="segnale">
        <div class="onde" aria-hidden="true">
        <svg viewBox="0 0 64 48" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round">
          <path d="M4 15 A 39 39 0 0 1 60 15"/>
          <path d="M13 24.5 A 26 26 0 0 1 51 24.5"/>
          <path d="M21.5 33.8 A 14 14 0 0 1 42.5 33.8"/>
          <circle cx="32" cy="42" r="3.4" fill="currentColor" stroke="none"/>
        </svg>
        </div>
        <span class="qui">Appoggia qui</span>
      </div>

      <div class="divisorio"></div>

      <div class="testo">
        <div class="occhiello">Connessione ospiti</div>
        <div class="titolo">Avvicina il telefono<br>e sei online</div>
        <div class="come">Niente password da chiedere al personale.</div>
        <div class="rete">
          <div class="et">Rete</div>
          <div class="riga"></div>
        </div>
      </div>
    </div>
    <div class="firma">SB Food Consulting</div>
  </div>

</body>
</html>
