<style>
/* ════════════════════════════════════════════════════════════
   PROTOTIPO — menù digitale aperto dal tap sul tavolo.
   Osteria di fantasia, foto generate. Idea visiva: l'arco romano
   (le foto sono finestre ad arco), le portate in numeri romani,
   i prezzi come su uno scontrino. Verde bottiglia, ottone, un solo
   rosso (pomodoro) per le cose che contano.
   ════════════════════════════════════════════════════════════ */
:root {
  --ground: #ece6d9;
  --card: #f6f2e8;
  --ink: #15241d;
  --muted: #5b675f;
  --line: rgba(21, 36, 29, .14);
  --accent: #c2412a;
  --brass: #8d6d31;
  --arch-shadow: rgba(38, 30, 18, .28);
  --sheet: #f6f2e8;
  --veil: rgba(15, 28, 23, .55);
  --display: 'Gloock', 'Bodoni 72', 'Didot', Georgia, serif;
  --body: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gutter: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e1b16; --card: #142520; --ink: #eee7d8; --muted: #98a69c;
    --line: rgba(238, 231, 216, .12); --accent: #e0603f; --brass: #cdac68;
    --arch-shadow: rgba(0, 0, 0, .55); --sheet: #132520; --veil: rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e1b16; --card: #142520; --ink: #eee7d8; --muted: #98a69c;
  --line: rgba(238, 231, 216, .12); --accent: #e0603f; --brass: #cdac68;
  --arch-shadow: rgba(0, 0, 0, .55); --sheet: #132520; --veil: rgba(0, 0, 0, .6);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: var(--gutter); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

/* ── barra alta: monogramma + lingue ── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 54px; }
.mono { font-family: var(--display); font-size: 1.05rem; letter-spacing: .02em; white-space: nowrap; }
.mono b { color: var(--accent); font-weight: 400; }
.lang { display: flex; gap: 2px; font: 500 .72rem/1 var(--mono); letter-spacing: .08em; }
.lang button { background: none; border: 0; padding: 8px 7px; cursor: pointer; color: var(--muted); border-radius: 2px; }
.lang button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -1.5px 0 var(--accent); }

/* ── fine pasto: compare in cima dopo un'ora e mezza ── */
.conto { display: none; background: var(--ink); color: var(--ground); }
.conto.on { display: block; animation: scende .6s cubic-bezier(.2,.8,.2,1); }
@keyframes scende { from { transform: translateY(-12px); opacity: 0; } }
.conto .wrap { padding-block: 16px 18px; display: grid; gap: 10px; }
.conto p { margin: 0; font-family: var(--display); font-size: 1.35rem; line-height: 1.2; }
.conto small { opacity: .7; font-size: .85rem; }
.conto .row { display: flex; gap: 8px; flex-wrap: wrap; }
.conto a { flex: 1 1 140px; text-align: center; padding: 11px 12px; border: 1px solid color-mix(in srgb, var(--ground) 40%, transparent); color: inherit; text-decoration: none; font-weight: 600; font-size: .9rem; border-radius: 2px; }
.conto a.g { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── apertura: l'arco ── */
.hero { padding-block: 28px 8px; }
.arco { position: relative; aspect-ratio: 3 / 3.4; max-width: 100%; border-radius: 999px 999px 4px 4px; overflow: hidden; box-shadow: 0 30px 60px -28px var(--arch-shadow); }
.arco img { width: 100%; height: 100%; object-fit: cover; display: block; }
.arco::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.tavolo { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ground); color: var(--ink); font: 500 .72rem/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 9px 14px; border-radius: 2px; white-space: nowrap; }
.tavolo b { color: var(--accent); font-weight: 500; }
.nome { font-family: var(--display); font-weight: 400; font-size: clamp(2.9rem, 13vw, 4.2rem); line-height: .92; letter-spacing: -.01em; margin: 26px 0 0; text-wrap: balance; }
.nome em { font-style: normal; color: var(--accent); }
.dove { margin: 12px 0 0; color: var(--muted); font-size: .95rem; }
.azioni { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
.azioni a, .azioni button { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; font-size: .88rem; font-weight: 500; border-radius: 2px; cursor: pointer; }
.azioni svg { width: 17px; height: 17px; color: var(--brass); flex: none; }

/* ── indice delle portate ── */
.indice { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 15; background: var(--ground); border-bottom: 1px solid var(--line); margin-top: 30px; }
.indice .wrap { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; padding-block: 12px; }
.indice .wrap::-webkit-scrollbar { display: none; }
.indice a { white-space: nowrap; text-decoration: none; color: var(--muted); font-size: .9rem; font-weight: 500; display: flex; gap: 6px; align-items: baseline; }
.indice a span { font: 400 .72rem var(--display); color: var(--brass); }
.indice a.on { color: var(--ink); }

/* ── una portata ── */
.portata { padding-block: 44px 8px; scroll-margin-top: 110px; }
.portata-h { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
.portata-h .num { font-family: var(--display); font-size: 3.4rem; line-height: .8; color: transparent; -webkit-text-stroke: 1px var(--brass); }
.portata-h h2 { font-family: var(--display); font-weight: 400; font-size: 2rem; margin: 0; line-height: 1; }
.portata-h small { margin-left: auto; font: .7rem var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }

/* il piatto della casa: l'arco grande, il testo che lo sormonta */
.casa { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; margin-bottom: 26px; }
.casa .arco { aspect-ratio: 4 / 4.3; }
.casa .ribbon { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); font: 500 .66rem/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; background: var(--accent); color: #fff; padding: 7px 11px; border-radius: 2px; white-space: nowrap; }
.casa .testo { position: relative; margin: -46px 14px 0; background: var(--card); padding: 18px 18px 16px; border-radius: 2px; box-shadow: 0 18px 40px -26px var(--arch-shadow); }
.casa h3 { font-family: var(--display); font-weight: 400; font-size: 1.65rem; line-height: 1.08; margin: 0; }

.piatto { display: grid; grid-template-columns: 1fr 104px; gap: 16px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 18px 0; cursor: pointer; }
.piatto h3 { font-family: var(--display); font-weight: 400; font-size: 1.28rem; line-height: 1.12; margin: 0; }
.piatto .foto { width: 104px; aspect-ratio: 4 / 5; border-radius: 52px 52px 3px 3px; overflow: hidden; }
.piatto .foto img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
.piatto:hover .foto img { transform: scale(1.04); }
.sub { color: var(--muted); font-size: .86rem; font-style: italic; margin: 3px 0 0; }
.desc { font-size: .92rem; margin: 8px 0 0; color: color-mix(in srgb, var(--ink) 82%, var(--ground)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.prezzo { font: 500 .95rem var(--mono); font-variant-numeric: tabular-nums; }
.all { display: flex; gap: 3px; }
.all i { font: 500 .62rem/1 var(--mono); font-style: normal; width: 19px; height: 19px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); }

/* vini: niente foto, un elenco da carta */
.vino { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.vino b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.vino span { color: var(--muted); font-size: .84rem; grid-column: 1; }
.vino .prezzo { grid-row: 1 / span 2; grid-column: 2; text-align: right; line-height: 1.5; font-size: .85rem; }

/* ── Wi-Fi: una targa smaltata ── */
.wifi { margin-top: 50px; background: var(--ink); color: var(--ground); border-radius: 3px; padding: 22px; position: relative; overflow: hidden; scroll-margin-top: 110px; }
.wifi::before { content: ""; position: absolute; inset: 6px; border: 1px solid color-mix(in srgb, var(--brass) 70%, transparent); border-radius: 2px; pointer-events: none; }
.wifi h2 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
.wifi h2 svg { width: 26px; color: var(--brass); }
.wifi dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font: .95rem var(--mono); align-items: baseline; }
.wifi dt { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
.wifi dd { margin: 0; word-break: break-all; user-select: all; }
.wifi button { margin-top: 16px; width: 100%; padding: 13px; background: var(--brass); color: #16120a; border: 0; border-radius: 2px; font-weight: 600; cursor: pointer; position: relative; }

/* ── recensioni, in fondo ── */
.fine { margin-top: 50px; text-align: center; padding-block: 36px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); scroll-margin-top: 110px; }
.fine h2 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0; }
.fine p { color: var(--muted); max-width: 34ch; margin: 8px auto 18px; font-size: .95rem; }
.fine .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.fine a { padding: 11px 18px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 600; font-size: .9rem; border-radius: 2px; background: var(--card); }
.fine a.g { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── piede: allergeni e note ── */
.piede { padding-block: 34px 50px; font-size: .84rem; color: var(--muted); scroll-margin-top: 110px; }
.piede h2 { font-family: var(--display); font-weight: 400; font-size: 1.3rem; color: var(--ink); margin: 0 0 12px; }
.legenda { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; margin: 0 0 20px; padding: 0; list-style: none; }
.legenda li { display: flex; gap: 8px; align-items: center; }
.legenda i { font: 500 .62rem/1 var(--mono); font-style: normal; width: 19px; height: 19px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; flex: none; }
.firma { margin-top: 26px; font: .68rem var(--mono); letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.demo { background: none; border: 1px dashed var(--line); color: var(--muted); padding: 6px 10px; font: .68rem var(--mono); letter-spacing: .08em; cursor: pointer; border-radius: 2px; }

/* ── scheda del piatto ── */
.velo { position: fixed; inset: 0; background: var(--veil); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .3s; }
.velo.on { opacity: 1; pointer-events: auto; }
.scheda { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; overflow-y: auto; background: var(--sheet); border-radius: 14px 14px 0 0; transform: translateY(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom, 0px); }
.scheda { visibility: hidden; }
.scheda.on { transform: none; visibility: visible; }
.scheda-in { max-width: 560px; margin: 0 auto; padding: 0 var(--gutter) 28px; }
.scheda .maniglia { width: 42px; height: 4px; border-radius: 2px; background: var(--line); margin: 10px auto 14px; }
.scheda .arco { aspect-ratio: 4 / 3.6; }
.scheda h3 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1.05; margin: 20px 0 0; }
.scheda .desc { -webkit-line-clamp: unset; display: block; font-size: 1rem; }
.scheda .blocco { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .9rem; }
.scheda .blocco b { display: block; font: 500 .68rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); margin-bottom: 4px; }
.chiudi { position: sticky; top: 10px; float: right; margin: 10px 0 0; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-size: 1.1rem; line-height: 1; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--ground); padding: 11px 18px; font-size: .88rem; border-radius: 2px; opacity: 0; transition: .35s; z-index: 50; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>

        if (!v.isIntersecting) return;
        document.querySelectorAll('#indice a').forEach(function (a) {
          var on = a.dataset.s === v.target.id; a.classList.toggle('on', on);
          if (on) { var c = a.parentNode; c.scrollTo({ left: a.offsetLeft - (c.clientWidth - a.offsetWidth) / 2, behavior: 'smooth' }); }
        });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    document.querySelectorAll('.portata').forEach(function (s) { oss.observe(s); });
  }

  disegna(); aggiornaFine();
})();
</script>
