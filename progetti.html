<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Progetti">
<meta name="theme-color" content="#f5f1eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Progetti · SB Food</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<!--
  Progetti di Simone, fatta come un'app del telefono (modello: Promemoria di iPhone).
  Prima schermata: quattro riquadri con i conteggi (Urgenti, In lavorazione, Da aggiornare,
  Tutti) che filtrano la lista sotto. Ogni progetto: a che punto siamo, cose da fare (le
  urgenti in cima), cose fatte. Si aggiorna dettando una nota: il telefono trascrive
  (riconoscimento vocale del browser; se non c'è o si ferma, il microfono della tastiera),
  il server (backend_sbfc, routes/progetti.py) la trasforma in voci con Claude.
  Carattere di sistema del telefono; colore d'accento terracotta SB Food.
  Login uguale al gestionale: chiave in localStorage 'sb_admin_token'.
-->
<style>
:root{
  --sfondo:#f5f1eb; --cella:#ffffff; --testo:#1c1c1e; --sec:#6c6a67; --ter:#b4afa8; --sep:#ebe6df;
  --ombra:0 1px 2px rgba(70,45,25,.05),0 6px 18px -8px rgba(70,45,25,.16);
  --acc:#c4622d; --acc-tenue:#fbeee6;
  --verde:#2e9a5e; --blu:#2f6fd6; --giallo:#d99a00; --grigio:#8e8e93; --rosso:#d93b30;
  --barra:rgba(249,249,251,.88); --tutti:#48484a;
}
@media (prefers-color-scheme: dark){
  :root{
    --sfondo:#0d0d0f; --cella:#1c1c1e; --testo:#f2f2f7; --sec:#9a9aa0; --ter:#5a5a5f; --sep:#2c2c2e;
    --ombra:none;
    --acc:#e8804a; --acc-tenue:#3a2519;
    --verde:#3fbf75; --blu:#4c8dff; --giallo:#ffc233; --grigio:#8e8e93; --rosso:#ff5a4f;
    --barra:rgba(22,22,24,.88); --tutti:#636366;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--sfondo)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;background:var(--sfondo);color:var(--testo);
  font-size:17px;line-height:1.35;min-height:100dvh;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left;touch-action:manipulation}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;padding:0 16px}
svg{display:block}

/* barra in alto */
.nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:0 -16px;padding:0 8px;
  background:var(--sfondo)}
.nav button{min-height:44px;padding:0 8px;color:var(--acc);font-size:17px;display:flex;align-items:center;gap:2px}
.nav .ind svg{width:13px;height:21px}
.grande{font-size:34px;font-weight:700;letter-spacing:.2px;line-height:1.15;margin:2px 0 14px;word-break:break-word}
.sotto{font-size:15px;color:var(--sec);margin:-10px 0 16px}

/* benvenuto */
.ciao{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;margin:4px 0 14px;color:#fff;
  background:radial-gradient(260px 200px at 100% 0%,rgba(255,196,150,.55),transparent 70%),linear-gradient(140deg,#d2723b,#a2441d 70%,#7d3214);
  box-shadow:0 14px 30px -14px rgba(160,70,30,.7)}
.ciao::after{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.08)}
.ciao .d{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;opacity:.8}
.ciao h2{font-size:26px;font-weight:700;line-height:1.15;margin:4px 0 10px}
.ciao p{position:relative;z-index:1;font-size:16px;line-height:1.4;opacity:.95;max-width:280px}
.ciao p b{font-weight:700}
/* riquadri (come Promemoria, ma pieni di colore) */
.tessere{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.tessera{background:linear-gradient(145deg,var(--c),var(--c2));color:#fff;border-radius:18px;padding:12px 14px 12px 12px;min-height:92px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;
  align-content:space-between;transition:transform .12s, box-shadow .15s;box-shadow:0 10px 20px -12px var(--c)}
.tessera:active{transform:scale(.97)}
.tessera .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);color:#fff}
.tessera .ic svg{width:17px;height:17px}
.tessera .n{justify-self:end;font-size:32px;font-weight:800;line-height:1}
.tessera .l{grid-column:1/-1;font-size:15px;font-weight:600;margin-top:10px;opacity:.95}
.tessera.on{box-shadow:0 0 0 3px var(--sfondo),0 0 0 5.5px var(--c)}
.tessere.filtro .tessera:not(.on){opacity:.55}

/* gruppi di righe */
.titolo-g{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;margin:0 4px 10px}
.titolo-g .cnt{display:inline-block;margin-left:6px;font-size:13px;font-weight:700;background:var(--sep);color:var(--sec);border-radius:10px;padding:1px 8px;vertical-align:3px}
.titolo-g button{font-size:16px;font-weight:400;color:var(--acc);min-height:36px}
.gruppo{background:var(--cella);border-radius:16px;overflow:hidden;margin-bottom:26px;box-shadow:var(--ombra)}
.riga{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 12px 12px 14px;position:relative}
.riga:active{background:var(--sep)}
.riga+.riga::before{content:"";position:absolute;top:0;right:0;left:72px;border-top:.5px solid var(--sep)}
.riga .ic{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--a1),var(--a2));color:#fff;font-size:16px;font-weight:800;letter-spacing:.3px}
.riga .ic svg{width:20px;height:20px}
.riga .t{font-weight:600}
.stato-t{color:var(--c);font-weight:600}
.barra-av{display:flex;align-items:center;gap:8px;margin-top:7px}
.barra-av i{flex:1;height:5px;border-radius:3px;background:var(--sep);overflow:hidden;max-width:160px}
.barra-av i b{display:block;height:100%;border-radius:3px;background:var(--c)}
.barra-av span{font-size:12.5px;color:var(--sec);font-variant-numeric:tabular-nums}
.riga .c{flex:1;min-width:0}
.riga .t{display:block;font-size:17px;line-height:1.25}
.riga .s{display:block;font-size:14px;color:var(--sec);margin-top:2px}
.riga .s .rosso{color:var(--acc);font-weight:600}
.badge{flex:none;min-width:24px;height:24px;border-radius:12px;padding:0 7px;background:var(--acc);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}
.chev{flex:none;width:8px;height:14px;color:var(--ter)}
.st-in_lavorazione{--c:var(--verde)} .st-aperto{--c:var(--blu)} .st-in_attesa{--c:var(--giallo)} .st-chiuso{--c:var(--grigio)}
.vuoto{padding:18px 16px;color:var(--sec);font-size:16px}
.sk{height:60px;background:linear-gradient(90deg,var(--cella),var(--sep),var(--cella));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* pagina progetto */
.testa{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 18px 20px;margin:4px 0 18px;color:#fff;display:flex;gap:14px;align-items:center;
  background:radial-gradient(240px 180px at 100% 0%,rgba(255,255,255,.28),transparent 70%),linear-gradient(145deg,var(--a1),var(--a2));box-shadow:0 14px 28px -16px var(--a2)}
.testa .c{flex:1;min-width:0}
.testa h1{font-size:28px;font-weight:800;line-height:1.12;margin-bottom:10px;word-break:break-word}
.testa .pill{background:rgba(255,255,255,.22);color:#fff}
.testa .pill::before{background:#fff}
.testa .agg{display:block;color:rgba(255,255,255,.88);margin-top:8px}
.testa .agg .rosso{color:#fff;font-weight:700}
.anello{flex:none;width:76px;height:76px;position:relative}
.anello svg{width:76px;height:76px;transform:rotate(-90deg)}
.anello circle{fill:none;stroke-width:7}
.anello .tr{stroke:rgba(255,255,255,.25)}
.anello .pr{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.9,.3,1)}
.anello b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:800}
.anello small{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:11.5px;opacity:.85;white-space:nowrap}
.stato-riga{display:flex;align-items:center;gap:10px;margin:-6px 0 18px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:16px;background:var(--cella);font-size:15px;font-weight:600;color:var(--c)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pill svg{width:10px;height:10px;opacity:.6}
.agg{font-size:14px;color:var(--sec)}
.agg .rosso{color:var(--acc);font-weight:600}
.punto{background:var(--cella);border-radius:16px;padding:14px 16px 14px 56px;margin-bottom:26px;position:relative;box-shadow:var(--ombra)}
.punto::before{content:"\201C";position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--acc-tenue);color:var(--acc);
  font:700 26px/40px Georgia,serif;text-align:center}
.punto h3{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.punto p{font-size:17px;line-height:1.45}
.punto.vuota p{color:var(--sec)}
.avviso{display:flex;align-items:center;gap:10px;background:var(--acc-tenue);border-radius:12px;padding:12px 14px;font-size:15px;margin:-12px 0 26px}
.avviso button{margin-left:auto;color:var(--acc);font-weight:600;min-height:36px;flex:none}

.cosa{display:flex;align-items:flex-start;gap:12px;padding:12px 6px 12px 14px;min-height:52px;position:relative}
.cosa+.cosa::before{content:"";position:absolute;top:0;right:0;left:52px;border-top:.5px solid var(--sep)}
.cosa.nuova{animation:nuova 2.4s ease-out}
@keyframes nuova{0%,45%{background:var(--acc-tenue)}100%{background:transparent}}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ter);margin-top:1px;position:relative;transition:background .15s,border-color .15s}
.tick::before{content:"";position:absolute;inset:-10px}
.cosa.urg .tick{border-color:var(--acc);border-width:2px}
.tick.si{background:var(--acc);border-color:var(--acc)}
.tick.si::after{content:"";position:absolute;left:8px;top:4px;width:5px;height:10px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
.cosa .t{flex:1;min-width:0;font-size:17px;line-height:1.3}
.cosa .t small{display:block;font-size:14px;color:var(--sec);margin-top:3px}
.cosa.urg .t small{display:inline-block;color:var(--acc);font-weight:700;background:var(--acc-tenue);border-radius:8px;padding:2px 8px;margin-top:5px;font-size:13px}
.cosa.urg{background:linear-gradient(90deg,var(--acc-tenue),transparent 55%)}
.cosa.fatta .t{color:var(--sec)}
.cosa.fatta .tick{background:var(--ter);border-color:var(--ter)}
.cosa.fatta .tick::after{content:"";position:absolute;left:8px;top:4px;width:5px;height:10px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
.altro{flex:none;width:40px;height:32px;display:grid;place-items:center;color:var(--ter);margin-top:-4px}
.altro svg{width:20px;height:20px}
.piu-righe{display:block;width:100%;min-height:44px;padding:0 16px;color:var(--acc);font-size:16px;border-top:.5px solid var(--sep);text-align:left}
.nota{padding:12px 16px;font-size:15px;position:relative}
.nota+.nota::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.nota small{display:block;color:var(--sec);font-size:13px;margin-bottom:2px}
.nota .az{display:flex;gap:16px;margin-top:6px;font-size:14px}
.nota .az button{color:var(--acc);min-height:32px}
.elimina{display:block;width:100%;min-height:50px;background:var(--cella);border-radius:12px;color:var(--rosso);font-size:17px;text-align:center;margin-bottom:12px}

/* barra in basso */
.giu{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--barra);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.giu .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.nuovo{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--acc);font-size:17px;font-weight:600}
.nuovo .p{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
.nuovo .p svg{width:14px;height:14px}
.registra{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:600}
.registra svg{width:22px;height:22px}
.registra:active,.nuovo:active{opacity:.7}

/* fogli */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;transition:opacity .2s}
.velo.on{opacity:1}
.foglio{position:fixed;left:0;right:0;bottom:0;z-index:21;padding:0 8px calc(8px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.foglio.on{transform:none}
.foglio .in{max-width:560px;margin:0 auto}
.azioni{background:var(--cella);border-radius:14px;overflow:hidden;margin-bottom:8px}
.azioni .tit{padding:14px 16px 12px;text-align:center;font-size:13px;color:var(--sec);border-bottom:.5px solid var(--sep)}
.azioni button{display:block;width:100%;min-height:56px;text-align:center;font-size:20px;color:var(--acc);border-top:.5px solid var(--sep)}
.azioni .tit+button{border-top:0}
.azioni button.on{font-weight:600}
.azioni button.rosso{color:var(--rosso)}
.annulla{display:block;width:100%;min-height:56px;background:var(--cella);border-radius:14px;font-size:20px;font-weight:600;color:var(--acc);text-align:center}
.modulo{background:var(--cella);border-radius:14px;padding:16px;margin-bottom:8px}
.modulo h3{font-size:17px;font-weight:600;text-align:center;margin-bottom:14px}
.modulo label.lab{display:block;font-size:13px;color:var(--sec);margin:0 0 6px 2px}
.modulo input[type=text],.modulo input[type=password]{width:100%;min-height:48px;border-radius:10px;border:0;background:var(--sfondo);padding:0 12px;font-size:17px}
.modulo .sw{display:flex;align-items:center;justify-content:space-between;min-height:48px;font-size:17px;border-bottom:.5px solid var(--sep)}
.modulo .sw:last-of-type{border-bottom:0}
.modulo .sw input{width:22px;height:22px;accent-color:var(--acc)}
.modulo .ok{display:block;width:100%;min-height:50px;border-radius:12px;background:var(--acc);color:#fff;font-size:17px;font-weight:600;text-align:center;margin-top:14px}
.err{color:var(--rosso);font-size:14px;min-height:18px;margin-top:6px;text-align:center}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* dettatura a schermo intero */
.detta{position:fixed;inset:0;z-index:30;background:var(--sfondo);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.detta.on{transform:none}
.d-nav{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.d-nav button{color:var(--acc);font-size:17px;min-height:44px}
.d-nav b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.d-carta{flex:1;min-height:0;overflow-y:auto;background:var(--cella);border-radius:14px;padding:16px;margin-top:6px}
.d-carta textarea{display:block;width:100%;border:0;background:transparent;resize:none;overflow:hidden;font-size:20px;line-height:1.4;min-height:56px}
.d-carta textarea:focus{outline:none}
.d-carta textarea::placeholder{color:var(--ter)}
.interim{font-size:20px;line-height:1.4;color:var(--ter)}
.d-msg{background:var(--acc-tenue);border-radius:12px;padding:12px 14px;font-size:15px;margin-top:12px}
.d-giu{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:18px}
.mic{width:76px;height:76px;border-radius:50%;border:4px solid var(--ter);display:grid;place-items:center;position:relative;background:transparent}
.mic span{width:58px;height:58px;border-radius:50%;background:var(--rosso);transition:all .2s}
.detta.ascolta .mic span{width:30px;height:30px;border-radius:7px}
.mic::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--rosso);opacity:0}
.detta.parla .mic::after{animation:anello 1.1s ease-out infinite}
@keyframes anello{from{transform:scale(.9);opacity:.8}to{transform:scale(1.2);opacity:0}}
.d-stato{font-size:15px;color:var(--sec);min-height:20px}
.d-giu .registra{margin-top:8px}
.d-giu .registra[disabled]{opacity:.4}
.d-lavoro{position:absolute;inset:0;background:var(--sfondo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:17px;color:var(--sec)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--sep);border-top-color:var(--acc);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(1turn)}}

.login{max-width:420px;margin:0 auto;padding:14vh 16px 0}
.login p{color:var(--sec);margin:-6px 0 22px}
.login .modulo input{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;background:rgba(40,40,42,.92);color:#fff;
  font-size:15px;font-weight:600;padding:10px 16px;border-radius:20px;z-index:40;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="vLogin" class="login" hidden>
  <h1 class="grande">Progetti</h1>
  <p>Accedi con utente e password del gestionale.</p>
  <form id="fLogin" class="modulo">
    <label class="lab" for="lu">Utente</label><input type="text" id="lu" autocomplete="username" autocapitalize="none" required>
    <label class="lab" for="lp">Password</label><input type="password" id="lp" autocomplete="current-password" required>
    <button class="ok" type="submit">Entra</button>
    <p class="err" id="lErr" role="alert"></p>
  </form>
</section>

<section id="vLista" class="app" hidden>
  <div class="nav"><span></span><button id="bEsci">Esci</button></div>
  <div class="ciao" id="ciao"></div>
  <div class="tessere" id="tessere"></div>
  <div class="titolo-g"><span id="tLista">Tutti</span></div>
  <div class="gruppo" id="lista"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</section>

<section id="vProg" class="app" hidden>
  <div class="nav"><button class="ind" id="bBack"><svg viewBox="0 0 13 21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2L3 10.5 11 19"/></svg>Progetti</button><button id="bMenu">Modifica</button></div>
  <div class="testa" id="pTesta"><div class="c"><h1 id="pNome"></h1><button class="pill" id="pStato"></button><span class="agg" id="pAgg"></span></div>
    <div class="anello" id="pAnello"></div></div>
  <div class="punto" id="pPunto"><h3>A che punto siamo</h3><p></p></div>
  <div id="pAvviso"></div>
  <div class="titolo-g"><span>Da fare<span class="cnt" id="nDaFare"></span></span><button id="bAggiungi">+ Aggiungi</button></div>
  <div class="gruppo" id="lDaFare"></div>
  <div id="bFatte"><div class="titolo-g"><span>Fatto</span></div><div class="gruppo" id="lFatte"></div></div>
  <div id="bNote"><div class="titolo-g"><span>Note dettate</span></div><div class="gruppo" id="lNote"></div></div>
</section>

<div class="giu" id="giu" hidden><div class="in">
  <button class="nuovo" id="bNuovo"><span class="p"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 1.5v11M1.5 7h11"/></svg></span>Nuovo progetto</button>

</div></div>

<div class="velo" id="velo" hidden></div>

  <div class="d-nav"><button id="dChiudi">Annulla</button><b id="dNome"></b><span style="width:60px"></span></div>

    <textarea id="dTa" placeholder="Cosa hai fatto, cosa resta da fare, cosa è urgente…"></textarea>
    <div class="interim" id="dInt"></div>
    <div class="d-msg" id="dMsg" hidden role="status"></div>
  </div>
  <div class="d-giu">
    <button class="mic" id="dMic" aria-label="Inizia a dettare"><span></span></button>

    <button class="registra" id="dManda" disabled>Aggiorna il progetto</button>
  </div>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var LOCALE = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
var API = LOCALE && localStorage.getItem('sb_api_locale') ? localStorage.getItem('sb_api_locale') : 'https://web-production-f3794.up.railway.app';
// Link personale di Simone: progetti.html?k=CHIAVE entra senza password (la chiave apre solo i
// progetti). Resta nell'indirizzo apposta: così anche l'icona sulla schermata Home entra da sola.
var CHIAVE_LINK = (new URLSearchParams(location.search).get('k') || '').trim();
try { if (CHIAVE_LINK) localStorage.setItem('sb_progetti_token', CHIAVE_LINK); } catch (e){}
var TOKEN = CHIAVE_LINK || localStorage.getItem('sb_progetti_token') || localStorage.getItem('sb_admin_token') || '';
var STATI = [['in_lavorazione','In lavorazione'],['aperto','Aperto'],['in_attesa','In attesa'],['chiuso','Chiuso']];
var NOMI = {}; STATI.forEach(function(s){ NOMI[s[0]] = s[1]; });
var FERMO_GIORNI = 7;
var MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
var I = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5v4"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg>',
  piu: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  giu: '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 3.5L5 6.5 8 3.5"/></svg>',
  urg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v9M12 19v.5"/></svg>',
  lav: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6 4 4 6-7"/></svg>',
  orologio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 2"/></svg>',
  tutti: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>'
};
var corrente = null, nuoveIds = {}, progetti = [], filtro = 'tutti';
// ogni progetto ha la sua coppia di colori, sempre la stessa (dal nome)
var TINTE = [['#e0823f','#b4501f'],['#3e9b6a','#226b48'],['#4a7fd8','#2c56a8'],['#d4a12a','#a8740e'],['#c95a7a','#983a57'],
             ['#7a68d0','#5242a3'],['#2fa3a8','#1b7378'],['#8a7d70','#5e544a']];
function tinta(nome){ var h = 0; for (var i = 0; i < nome.length; i++) h = (h * 31 + nome.charCodeAt(i)) >>> 0; var t = TINTE[h % TINTE.length]; return '--a1:' + t[0] + ';--a2:' + t[1]; }

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
$('fabIco').innerHTML = I.mic;
try { filtro = sessionStorage.getItem('sb_prog_filtro') || 'tutti'; } catch (e){}

function api(metodo, path, corpo, attesa){
  var o = {method: metodo, headers: {'X-Admin-Token': TOKEN}};
  if (corpo !== undefined){ o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(corpo); }
  // senza risposta entro il tempo la richiesta si annulla: niente schermate bloccate
  var ctl = window.AbortController ? new AbortController() : null, scaduta = false;
  var t = ctl ? setTimeout(function(){ scaduta = true; ctl.abort(); }, attesa || 20000) : null;
  if (ctl) o.signal = ctl.signal;
  return fetch(API + path, o).then(function(r){
    clearTimeout(t);
    if (r.status === 401){ esci(); throw new Error('Accesso scaduto: rientra'); }
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok) throw new Error(j.error || 'Errore del server (' + r.status + ')');
      return j;
    });
  }, function(){ clearTimeout(t); throw new Error(scaduta ? 'Il server non risponde: riprova' : 'Nessuna connessione: riprova'); });
}
var tToast;
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tToast); tToast = setTimeout(function(){ t.classList.remove('on'); }, 2200); }

// ── date ──
function utc(s){ return s ? new Date(/Z|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z') : null; }
function giorniDa(d){ var a = new Date(); a.setHours(0,0,0,0); var b = new Date(d); b.setHours(0,0,0,0); return Math.round((a - b) / 864e5); }
function breve(s){
  var d = utc(s); if (!d) return null;
  var g = giorniDa(d);
  return g <= 0 ? 'oggi' : g === 1 ? 'ieri' : g < 7 ? g + ' giorni fa' : d.getDate() + ' ' + MESI[d.getMonth()];
}
function fermo(p){ var d = utc(p.aggiornato_il); return p.stato !== 'chiuso' && d && giorniDa(d) >= FERMO_GIORNI ? giorniDa(d) : 0; }
function daAggiornare(p){ return p.stato !== 'chiuso' && (!p.aggiornato_il || fermo(p) > 0); }
function aggiornato(p){
  var f = fermo(p);
  if (f) return '<span class="rosso">fermo da ' + f + ' giorni</span>';
  var b = breve(p.aggiornato_il);
  return b ? 'aggiornato ' + b : 'mai aggiornato';
}
function scadenza(s){
  if (!s) return '';
  var d = new Date(s + 'T12:00:00'), g = -giorniDa(d);
  if (g < 0) return 'scaduta il ' + d.getDate() + ' ' + MESI[d.getMonth()];
  if (g === 0) return 'entro oggi';
  if (g === 1) return 'entro domani';
  return 'entro ' + d.toLocaleDateString('it-IT', {weekday: 'long'}) + ' ' + d.getDate();
}

// ── viste ──
function mostra(v){
  ['vLogin','vLista','vProg'].forEach(function(id){ $(id).hidden = id !== v; });
  $('giu').hidden = v === 'vLogin';
  $('bNuovo').hidden = v !== 'vLista';
  $('bDetta').hidden = v !== 'vProg';
}
function route(){
  if (!TOKEN){ mostra('vLogin'); return; }
  var m = location.hash.match(/^#p\/(\d+)/);
  if (m) apriProgetto(+m[1]); else apriLista();
}

// ── prima schermata ──
function apriLista(){
  if ($('vLista').hidden) progetti = [];
  if ($('vLista').hidden) window.scrollTo(0, 0);
  corrente = null; document.title = 'Progetti · SB Food';
  mostra('vLista');
  api('GET', '/api/progetti').then(function(ps){ if (aperto() !== null) return; progetti = ps; disegnaLista(); })
    .catch(function(e){ $('lista').innerHTML = '<p class="vuoto">' + esc(e.message) + '</p>'; });
}

var FILTRI = [
  ['urgenti', 'Urgenti', '#e07a3e', '#b9481a', 'urg'],
  ['lavorazione', 'In lavorazione', '#3fa36d', '#237a4c', 'lav'],
  ['aggiornare', 'Da aggiornare', '#8f8a84', '#625d57', 'orologio'],
  ['tutti', 'Tutti', '#4d6fb8', '#304d8c', 'tutti']
];

function disegnaLista(){
  var vivi = progetti.filter(function(p){ return p.stato !== 'chiuso'; });
  var conti = {
    urgenti: vivi.reduce(function(t, p){ return t + p.urgenti; }, 0),
    lavorazione: vivi.filter(function(p){ return p.stato === 'in_lavorazione'; }).length,
    aggiornare: vivi.filter(daAggiornare).length,
    tutti: progetti.length
  };
  $('tessere').innerHTML = FILTRI.map(function(f){
    return '<button class="tessera' + (filtro === f[0] ? ' on' : '') + '" data-f="' + f[0] + '" style="--c:' + f[2] + ';--c2:' + f[3] + '" aria-pressed="' + (filtro === f[0]) + '">' +
      '<span class="ic">' + I[f[4]] + '</span><span class="n">' + conti[f[0]] + '</span><span class="l">' + f[1] + '</span></button>';
  }).join('');
  $('tessere').classList.toggle('filtro', filtro !== 'tutti');
  var h = new Date().getHours(), frasi = [];
  if (conti.urgenti) frasi.push('<b>' + conti.urgenti + (conti.urgenti === 1 ? ' cosa urgente' : ' cose urgenti') + '</b>');
  if (conti.aggiornare) frasi.push('<b>' + conti.aggiornare + (conti.aggiornare === 1 ? ' progetto' : ' progetti') + '</b> da aggiornare');
  $('ciao').innerHTML = '<div class="d">' + new Date().toLocaleDateString('it-IT', {weekday: 'long', day: 'numeric', month: 'long'}) + '</div>' +
    '<h2>' + (h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera') + ', Simone</h2>' +
    '<p>' + (frasi.length ? 'Oggi hai ' + frasi.join(' e ') + '.' : 'Tutto in ordine: niente di urgente oggi.') + '</p>';
  Array.prototype.forEach.call($('tessere').children, function(b){
    b.onclick = function(){ filtro = filtro === b.dataset.f && b.dataset.f !== 'tutti' ? 'tutti' : b.dataset.f; try { sessionStorage.setItem('sb_prog_filtro', filtro); } catch (e){} disegnaLista(); };
  });
  var tit = {urgenti: 'Urgenti', lavorazione: 'In lavorazione', aggiornare: 'Da aggiornare', tutti: 'Tutti'}[filtro];
  $('tLista').textContent = tit;

  var html;
  if (filtro === 'urgenti'){
    var urg = [];
    vivi.forEach(function(p){ (p.urgenti_lista || []).forEach(function(u){ urg.push({p: p, u: u}); }); });
    urg.sort(function(a, b){ return (a.u.scadenza || '9999') < (b.u.scadenza || '9999') ? -1 : 1; });
    html = urg.length ? urg.map(function(x){
      return '<button class="riga" data-id="' + x.p.id + '"><span class="ic" style="' + tinta(x.p.nome) + '">' + I.urg + '</span><span class="c"><span class="t">' + esc(x.u.testo) +
        '</span><span class="s">' + esc(x.p.nome) + (x.u.scadenza ? ' · <span class="rosso">' + scadenza(x.u.scadenza) + '</span>' : '') + '</span></span>' + I.chev + '</button>';
    }).join('') : '<p class="vuoto">Niente di urgente.</p>';
  } else {
    var lista = filtro === 'lavorazione' ? vivi.filter(function(p){ return p.stato === 'in_lavorazione'; })
      : filtro === 'aggiornare' ? vivi.filter(daAggiornare) : progetti;
    html = lista.length ? lista.map(rigaProgetto).join('') : '<p class="vuoto">Nessun progetto qui.</p>';
  }
  $('lista').innerHTML = html;
  Array.prototype.forEach.call($('lista').querySelectorAll('[data-id]'), function(b){
    b.onclick = function(){ location.hash = 'p/' + b.dataset.id; };
  });
}

function iniziali(n){
  var p = n.replace(/[^\p{L}\p{N} ]/gu, ' ').split(/\s+/).filter(Boolean);
  return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
}
function avanzamento(p){
  var tot = p.n_fatte + p.da_fare;
  return tot ? '<span class="barra-av"><i><b style="width:' + Math.round(100 * p.n_fatte / tot) + '%"></b></i><span>' + p.n_fatte + ' di ' + tot + ' fatte</span></span>' : '';
}
function rigaProgetto(p){
  return '<button class="riga st-' + p.stato + '" data-id="' + p.id + '"><span class="ic" style="' + tinta(p.nome) + '">' + esc(iniziali(p.nome)) + '</span><span class="c"><span class="t">' + esc(p.nome) +
    '</span><span class="s"><span class="stato-t">' + NOMI[p.stato] + '</span> · ' + aggiornato(p) + '</span>' + avanzamento(p) + '</span>' +
    (p.urgenti ? '<span class="badge" aria-label="' + p.urgenti + ' urgenti">' + p.urgenti + '</span>' : '') + I.chev + '</button>';
}

// ── progetto ──
function apriProgetto(id){
  if (!corrente || corrente.id !== id){
    corrente = null;
    window.scrollTo(0, 0);
    $('pNome').textContent = ''; $('pAgg').textContent = ''; $('pAnello').innerHTML = ''; $('pStato').innerHTML = ''; $('pPunto').querySelector('p').textContent = '';
    $('lDaFare').innerHTML = '<div class="sk"></div><div class="sk"></div>'; $('bFatte').hidden = true; $('bNote').hidden = true; $('pAvviso').innerHTML = '';
  }
  mostra('vProg');
  api('GET', '/api/progetti/' + id).then(disegnaProgetto).catch(function(e){ toast(e.message); });
}

function cosa(v, fatta){
  var info = fatta ? (breve(v.chiusa_il || v.creata_il) || '') : [v.urgente ? 'Urgente' : '', scadenza(v.scadenza)].filter(Boolean).join(' · ');
  return '<div class="cosa' + (v.urgente && !fatta ? ' urg' : '') + (fatta ? ' fatta' : '') + (nuoveIds[v.id] ? ' nuova' : '') + '">' +
    (fatta ? '<span class="tick" aria-hidden="true"></span>' : '<button class="tick" data-fatta="' + v.id + '" aria-label="Segna come fatta: ' + esc(v.testo) + '"></button>') +
    '<div class="t">' + esc(v.testo) + (info ? '<small>' + info + '</small>' : '') + '</div>' +
    '<button class="altro" data-menu="' + v.id + '" aria-label="Altre azioni">' + I.piu + '</button></div>';
}

var FATTE_CORTE = 5, fatteAperte = false;
function aperto(){ var m = location.hash.match(/^#p\/(\d+)/); return m ? +m[1] : null; }
function disegnaProgetto(p){
  if (!p || p.id !== aperto() || $('vProg').hidden) return;   // risposta arrivata tardi per un altro progetto
  if (!corrente || corrente.id !== p.id) fatteAperte = false;
  corrente = p;
  document.title = p.nome + ' · Progetti';
  $('pNome').textContent = p.nome;
  $('pTesta').setAttribute('style', tinta(p.nome));
  $('pStato').className = 'pill st-' + p.stato; $('pStato').innerHTML = NOMI[p.stato] + I.giu;
  var tot = p.n_fatte + p.da_fare, perc = tot ? Math.round(100 * p.n_fatte / tot) : 0, C = 2 * Math.PI * 32;
  $('pAnello').innerHTML = tot ? '<svg viewBox="0 0 76 76" aria-hidden="true"><circle class="tr" cx="38" cy="38" r="32"/><circle class="pr" cx="38" cy="38" r="32" stroke-dasharray="' + C.toFixed(1) +
    '" stroke-dashoffset="' + (C * (1 - perc / 100)).toFixed(1) + '"/></svg><b>' + perc + '%</b><small>' + p.n_fatte + ' di ' + tot + '</small>' : '';
  $('pAnello').hidden = !tot;
  $('nDaFare').textContent = p.aperte.length || '';
  $('pAgg').innerHTML = aggiornato(p);
  $('pPunto').className = 'punto' + (p.punto ? '' : ' vuota');
  $('pPunto').querySelector('p').textContent = p.punto || 'Ancora niente. Tocca «Detta una nota» e racconta a che punto siete.';
  $('lDaFare').innerHTML = p.aperte.length ? p.aperte.map(function(v){ return cosa(v, false); }).join('') : '<p class="vuoto">Niente da fare.</p>';
  $('bFatte').hidden = !p.fatte.length;
  var fatte = fatteAperte ? p.fatte : p.fatte.slice(0, FATTE_CORTE);
  $('lFatte').innerHTML = fatte.map(function(v){ return cosa(v, true); }).join('') +
    (p.fatte.length > FATTE_CORTE && !fatteAperte ? '<button class="piu-righe" id="bAltreFatte">Mostra altre</button>' : '');
  if ($('bAltreFatte')) $('bAltreFatte').onclick = function(){ fatteAperte = true; disegnaProgetto(corrente); };
  var daElab = p.note.filter(function(n){ return !n.elaborata; });
  $('pAvviso').innerHTML = daElab.length
    ? '<div class="avviso">Una nota non è ancora stata letta.<button data-riprova="' + daElab[daElab.length - 1].id + '">Riprova</button></div>' : '';
  $('bNote').hidden = !p.note.length;
  $('lNote').innerHTML = p.note.slice(0, 3).map(function(n){
    var d = utc(n.creata_il);
    return '<div class="nota"><small>' + breve(n.creata_il) + ' alle ' + d.toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}) + (n.elaborata ? '' : ' · da leggere') + '</small>' + esc(n.testo) +
      '<div class="az">' + (n.elaborata ? '' : '<button data-riprova="' + n.id + '">Leggi adesso</button>') +
      '<button data-toglinota="' + n.id + '">Togli</button></div></div>';
  }).join('');
  nuoveIds = {};
}

$('vProg').addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t || !corrente) return;
  var d = t.dataset;
  if (d.fatta){ t.classList.add('si'); if (navigator.vibrate) navigator.vibrate(10); setTimeout(function(){ agisci('PATCH', '/api/progetti/voci/' + d.fatta, {fatta: true}, 'Fatto'); }, 280); }
  else if (d.menu){ foglioVoce(+d.menu); }
  else if (d.riprova){ t.disabled = true; t.textContent = '…';
    api('POST', '/api/progetti/note/' + d.riprova + '/rielabora', undefined, 150000).then(function(j){ segnaNuove(corrente, j.progetto); disegnaProgetto(j.progetto); toast('Nota letta'); })
      .catch(function(e){ toast(e.message); t.disabled = false; t.textContent = 'Riprova'; }); }
  else if (d.toglinota){ if (confirm('Togliere questa nota e quello che aveva aggiunto?')) agisci('DELETE', '/api/progetti/note/' + d.toglinota, undefined, 'Nota tolta'); }
});

function agisci(metodo, path, corpo, msg){
  return api(metodo, path, corpo).then(function(p){ disegnaProgetto(p); if (msg) toast(msg); }).catch(function(e){ toast(e.message); });
}
function segnaNuove(prima, dopo){
  var c = {};
  if (prima) prima.aperte.concat(prima.fatte).forEach(function(v){ c[v.id + (v.chiusa_il ? 'c' : '')] = 1; });
  dopo.aperte.concat(dopo.fatte).forEach(function(v){ if (!c[v.id + (v.chiusa_il ? 'c' : '')]) nuoveIds[v.id] = 1; });
}

// ── fogli (stile foglio azioni di iPhone) ──
function apriFoglio(html){
  $('fIn').innerHTML = html + '<button class="annulla" id="annulla">Annulla</button>';
  $('velo').hidden = false; $('foglio').hidden = false;
  requestAnimationFrame(function(){ $('velo').classList.add('on'); $('foglio').classList.add('on'); });
  $('annulla').onclick = chiudiFoglio;
}
function chiudiFoglio(){
  $('velo').classList.remove('on'); $('foglio').classList.remove('on');
  setTimeout(function(){ $('velo').hidden = true; $('foglio').hidden = true; $('fIn').innerHTML = ''; }, 280);
}
$('velo').onclick = chiudiFoglio;
function azioni(titolo, bottoni){ return '<div class="azioni">' + (titolo ? '<div class="tit">' + esc(titolo) + '</div>' : '') + bottoni + '</div>'; }

$('pStato').onclick = function(){
  if (!corrente) return;
  apriFoglio(azioni('Stato del progetto', STATI.map(function(s){
    return '<button data-s="' + s[0] + '"' + (s[0] === corrente.stato ? ' class="on"' : '') + '>' + s[1] + (s[0] === corrente.stato ? ' ✓' : '') + '</button>';
  }).join('')));
  Array.prototype.forEach.call($('fIn').querySelectorAll('[data-s]'), function(b){
    b.onclick = function(){ chiudiFoglio(); if (b.dataset.s !== corrente.stato) agisci('PATCH', '/api/progetti/' + corrente.id, {stato: b.dataset.s}, NOMI[b.dataset.s]); };
  });
};

$('bMenu').onclick = function(){
  if (!corrente) return;
  apriFoglio(azioni(corrente.nome, '<button id="mRin">Cambia nome</button><button id="mEl" class="rosso">Elimina progetto</button>'));
  $('mRin').onclick = function(){
    var t = prompt('Nuovo nome', corrente.nome);
    if (t && t.trim()){ chiudiFoglio(); agisci('PATCH', '/api/progetti/' + corrente.id, {nome: t}, 'Fatto'); }
  };
  $('mEl').onclick = function(){
    if (!confirm('Eliminare «' + corrente.nome + '» con tutte le note? Non si può annullare.\n\nSe è solo finito, meglio metterlo «Chiuso».')) return;
    chiudiFoglio();
    api('DELETE', '/api/progetti/' + corrente.id).then(function(){ toast('Progetto eliminato'); location.hash = ''; }).catch(function(e){ toast(e.message); });
  };
};

$('bNuovo').onclick = function(){
  apriFoglio('<form class="modulo" id="fNuovo"><h3>Nuovo progetto</h3><label class="lab" for="nNome">Nome del cliente o del lavoro</label><input type="text" id="nNome" required maxlength="160" autocomplete="off">' +
    '<button class="ok" type="submit">Crea</button><p class="err" id="nErr" role="alert"></p></form>');
  setTimeout(function(){ $('nNome').focus(); }, 300);
  $('fNuovo').onsubmit = function(e){
    e.preventDefault();
    var b = this.querySelector('[type=submit]'); if (b.disabled) return; b.disabled = true;
    api('POST', '/api/progetti', {nome: $('nNome').value}).then(function(p){ chiudiFoglio(); location.hash = 'p/' + p.id; })
      .catch(function(err){ $('nErr').textContent = err.message; b.disabled = false; });
  };
};

function trovaVoce(id){ var t = corrente.aperte.concat(corrente.fatte); for (var i = 0; i < t.length; i++) if (t[i].id === id) return t[i]; }
function foglioVoce(id){
  var v = trovaVoce(id); if (!v) return;
  var aperta = v.tipo === 'da_fare' && !v.chiusa_il, riapribile = v.tipo === 'da_fare' && v.chiusa_il;
  apriFoglio(azioni(v.testo,
    (aperta ? '<button id="mUrg">' + (v.urgente ? 'Non è più urgente' : 'Segna come urgente') + '</button>' : '') +
    (riapribile ? '<button id="mRiapri">Rimetti da fare</button>' : '') +
    '<button id="mMod">Modifica</button><button id="mDel" class="rosso">Elimina</button>'));
  if (aperta) $('mUrg').onclick = function(){ chiudiFoglio(); agisci('PATCH', '/api/progetti/voci/' + id, {urgente: !v.urgente}, 'Fatto'); };
  if (riapribile) $('mRiapri').onclick = function(){ chiudiFoglio(); agisci('PATCH', '/api/progetti/voci/' + id, {fatta: false}, 'Rimessa da fare'); };
  $('mMod').onclick = function(){
    var t = prompt('Modifica', v.testo);
    if (t && t.trim() && t.trim() !== v.testo){ chiudiFoglio(); agisci('PATCH', '/api/progetti/voci/' + id, {testo: t}, 'Fatto'); }
  };
  $('mDel').onclick = function(){ chiudiFoglio(); agisci('DELETE', '/api/progetti/voci/' + id, undefined, 'Eliminata'); };
}

$('bAggiungi').onclick = function(){
  if (!corrente) return;
  apriFoglio('<form class="modulo" id="fVoce"><h3>Aggiungi</h3><label class="lab" for="vTesto">Cosa</label><input type="text" id="vTesto" required maxlength="300" autocomplete="off">' +
    '<div style="margin-top:8px"><label class="sw">Urgente <input type="checkbox" id="vUrg"></label><label class="sw">Già fatto <input type="checkbox" id="vFatto"></label></div>' +
    '<button class="ok" type="submit">Aggiungi</button><p class="err" id="vErr" role="alert"></p></form>');
  setTimeout(function(){ $('vTesto').focus(); }, 300);
  $('fVoce').onsubmit = function(e){
    e.preventDefault();

      .catch(function(err){ $('vErr').textContent = err.message; b.disabled = false; });

$('bBack').onclick = function(){ location.hash = ''; };

// ── dettatura ──
// Il riconoscimento vocale del browser trascrive mentre Simone parla. Su iPhone si ferma
// da solo dopo una pausa: si riparte finché non si tocca stop. Su Android una frase per
// volta (in modalità continua Chrome Android ripete le parole). Se il servizio non c'è o dà
// errore si passa al testo: il microfono della tastiera funziona sempre.
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var ANDROID = /Android/i.test(navigator.userAgent);
var rec = null, ascolta = false, base = '', sessione = '', vuote = 0, tParla, srGuasto = false;

function unisci(a, b){ a = (a || '').trim(); b = (b || '').trim(); return a && b ? a + ' ' + b : a || b; }

function apriDettatura(){
  if (!corrente) return;
  $('dNome').textContent = corrente.nome;
  $('dTa').value = ''; $('dInt').textContent = ''; $('dMsg').hidden = true; $('dLavoro').hidden = true;
  base = ''; sessione = ''; alta();
  $('detta').hidden = false;
  requestAnimationFrame(function(){ $('detta').classList.add('on'); });
  if (SR && !srGuasto) parti(); else modoTastiera();
}
function chiudiDettatura(){
  ferma();
  $('detta').classList.remove('on','ascolta','parla');
  setTimeout(function(){ $('detta').hidden = true; }, 320);
}
function parti(){
  base = $('dTa').value.trim(); sessione = ''; vuote = 0;
  ascolta = true; $('dMsg').hidden = true;
  avvia(); ui();
}
function avvia(){
  var ebbe = false;
  try { rec = new SR(); rec.lang = 'it-IT'; rec.interimResults = true; rec.continuous = !ANDROID; rec.maxAlternatives = 1; }
  catch (e){ guasto('start'); return; }
  rec.onresult = function(ev){
    ebbe = true;
    var fin = '', inter = '';
    for (var i = 0; i < ev.results.length; i++){
      var r = ev.results[i];
      if (r.isFinal) fin += r[0].transcript + ' '; else inter += r[0].transcript + ' ';
    }
    sessione = fin;
    $('dTa').value = unisci(base, fin);
    $('dInt').textContent = inter.trim();
    alta(); aggiornaManda(); parla();
  };
  rec.onspeechstart = parla;
  rec.onerror = function(ev){ if (ev.error !== 'no-speech' && ev.error !== 'aborted') guasto(ev.error); };
  rec.onend = function(){
    base = unisci(base, unisci(sessione, $('dInt').textContent)); sessione = '';
    $('dTa').value = base; $('dInt').textContent = ''; alta(); aggiornaManda();
    if (!ascolta){ ui(); return; }
    vuote = ebbe ? 0 : vuote + 1;
    if (vuote >= 4){ ascolta = false; messaggio('Non sento niente. Tocca il pulsante rosso per riprovare, oppure tocca il testo e usa il microfono della tastiera.'); ui(); return; }
    setTimeout(function(){ if (ascolta) avvia(); }, ANDROID ? 60 : 180);
  };
  try { rec.start(); } catch (e){ guasto('start'); }
}
function ferma(){ ascolta = false; if (rec){ try { rec.stop(); } catch (e){} } ui(); }
function guasto(err){
  ascolta = false;
  if (rec){ try { rec.abort(); } catch (e){} }
  var m = {
    'not-allowed': 'Il microfono non è permesso. Su iPhone: Impostazioni › Safari › Microfono › Consenti. Intanto tocca il testo e usa il microfono della tastiera.',
    'service-not-allowed': 'La dettatura non è attiva su questo telefono. Tocca il testo e usa il microfono della tastiera.',
    'audio-capture': 'Non trovo il microfono. Tocca il testo e usa il microfono della tastiera.',
    'network': 'La dettatura qui non è disponibile. Tocca il testo e usa il microfono della tastiera.'
  }[err] || 'La dettatura si è fermata. Tocca il pulsante rosso per riprendere, o usa il microfono della tastiera.';
  if (err === 'network' || err === 'service-not-allowed' || err === 'start') srGuasto = true;
  messaggio(m); ui();
}
function modoTastiera(){
  ascolta = false;
  if ($('dMsg').hidden) messaggio('Tocca il testo e usa il microfono della tastiera per dettare.');
  ui();
  setTimeout(function(){ $('dTa').focus(); }, 300);
}
function messaggio(t){ $('dMsg').textContent = t; $('dMsg').hidden = false; }
function parla(){ $('detta').classList.add('parla'); clearTimeout(tParla); tParla = setTimeout(function(){ $('detta').classList.remove('parla'); }, 700); }
function ui(){
  $('detta').classList.toggle('ascolta', ascolta);
  if (!ascolta) $('detta').classList.remove('parla');
  $('dTa').readOnly = ascolta;
  var puo = SR && !srGuasto;
  $('dMic').hidden = !puo;
  $('dMic').setAttribute('aria-label', ascolta ? 'Ferma' : 'Riprendi a dettare');
  $('dStato').textContent = !puo ? '' : ascolta ? 'Ti ascolto…' : ($('dTa').value.trim() ? 'Tocca per aggiungere' : 'Tocca per parlare');
  aggiornaManda();
}
function alta(){
  var t = $('dTa');
  t.style.height = 'auto'; t.style.height = Math.max(56, t.scrollHeight) + 'px';
  t.parentNode.scrollTop = t.parentNode.scrollHeight;
}
function aggiornaManda(){ $('dManda').disabled = unisci($('dTa').value, $('dInt').textContent).length < 3; }

$('dMic').onclick = function(){ ascolta ? ferma() : parti(); };
$('dTa').oninput = function(){ alta(); aggiornaManda(); };
$('dTa').onfocus = function(){ if (ascolta) ferma(); };
$('dChiudi').onclick = function(){
  if ($('dTa').value.trim().length > 20 && !confirm('Uscire senza aggiornare? Quello che hai dettato si perde.')) return;
  chiudiDettatura();
};
$('bDetta').onclick = apriDettatura;
$('dManda').onclick = function(){
  ferma();
  var testo = unisci($('dTa').value, $('dInt').textContent);
  if (testo.length < 3 || !corrente || !$('dLavoro').hidden) return;
  $('dLavoro').hidden = false;
  var prima = corrente;
  api('POST', '/api/progetti/' + corrente.id + '/note', {testo: testo}, 150000).then(function(j){
    segnaNuove(prima, j.progetto);
    disegnaProgetto(j.progetto);
    chiudiDettatura();
    window.scrollTo({top: 0, behavior: 'smooth'});
    toast(j.avviso ? 'Nota salvata, da leggere' : 'Progetto aggiornato');
  }).catch(function(e){
    $('dLavoro').hidden = true;
    $('dTa').value = testo; $('dInt').textContent = ''; alta();
    messaggio(e.message + '. Il testo resta qui: riprova.');
    ui();
  });
};

// ── accesso ──
$('fLogin').onsubmit = function(e){
  e.preventDefault();
  $('lErr').textContent = '';
  fetch(API + '/api/admin/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: $('lu').value.trim(), password: $('lp').value})})
    .then(function(r){ return r.json().then(function(j){ return {ok: r.ok, j: j}; }); })
    .then(function(x){
      if (!x.ok || !x.j.token){ $('lErr').textContent = x.j.error || 'Accesso non riuscito'; return; }
      TOKEN = x.j.token;
      localStorage.setItem('sb_admin_token', TOKEN);
      localStorage.setItem('sb_admin_logged', 'true');
      route();
    }).catch(function(){ $('lErr').textContent = 'Nessuna connessione: riprova'; });
};
function esci(){
  TOKEN = '';
  try { localStorage.removeItem('sb_admin_token'); localStorage.removeItem('sb_admin_logged'); localStorage.removeItem('sb_progetti_token'); } catch (e){}
  if (CHIAVE_LINK){ CHIAVE_LINK = ''; history.replaceState(null, '', location.pathname); }
  location.hash = ''; mostra('vLogin');
}
$('bEsci').onclick = function(){ if (confirm('Uscire?')) esci(); };

window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && TOKEN && $('foglio').hidden && $('detta').hidden) route();
});
route();
})();
</script>
