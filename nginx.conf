server {
    listen 8080;
    root /app;
    index index.html;

    # 301 dai vecchi URL Wix (migrazione) verso le pagine attuali
    location = /about-3 { return 301 /chi-siamo; }
    location = /about-3.html { return 301 /chi-siamo; }
    location = /service-page/consulenza-per-avviamento { return 301 /servizi; }
    location = /service-page/consulenza-per-avviamento.html { return 301 /servizi; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Schede scaricabili: forza il download (Safari ignora l'attributo HTML "download").
    # Gli "-esempio" restano esclusi e si aprono in anteprima nel browser.
    location ~* /assets/pdf/risorse/.*(?<!-esempio)\.pdf$ {
        add_header Content-Disposition "attachment";
        expires 30d;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|mp4|m4a|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
}
