<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Lascia una recensione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Micro-pagina aperta dal tap sulla Placca NFC. Legge /api/nfc/p/<slug>.
   Un solo link e niente menù → redirect immediato. */
:root { --bg:#2b2d31; --fg:#f5f2ee; --ac:#c4622d; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { min-height:100%; }
body { background:var(--bg); color:var(--fg); font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; padding:32px 22px; -webkit-font-smoothing:antialiased; transition:background .3s; }
.card { width:100%; max-width:420px; text-align:center; }
.frame { border:1px solid var(--ac); padding:40px 26px 34px; position:relative; }
.logo { max-height:72px; max-width:60%; object-fit:contain; margin:0 auto 18px; display:block; }
.nome { font-family:'Playfair Display',serif; font-size:1.7rem; line-height:1.15; font-weight:600; margin-bottom:8px; }
.sub { font-family:'Playfair Display',serif; font-style:italic; color:var(--ac); font-size:1rem; margin-bottom:30px; }
.btn { display:flex; align-items:center; gap:14px; width:100%; padding:16px 18px; margin-bottom:12px; border:1.5px solid var(--ac); color:inherit; text-decoration:none; font-weight:600; font-size:.95rem; letter-spacing:.3px; transition:background .2s, transform .2s; }
.btn:active { transform:scale(.985); }
.btn svg { width:22px; height:22px; flex:none; color:var(--ac); }
.btn span { flex:1; text-align:left; }
.btn .arr { color:var(--ac); }
.btn-menu { background:var(--ac); color:#fff; border-color:var(--ac); }
.btn-menu svg, .btn-menu .arr { color:#fff; }
.foot { margin-top:26px; font-size:.62rem; letter-spacing:3px; text-transform:uppercase; opacity:.5; }
.state { padding:60px 0; font-family:'Playfair Display',serif; font-style:italic; opacity:.7; }
</style>
</head>
<body>
<div class="card" id="card"><div class="state" id="state">Un attimo&hellip;</div></div>
<script>
(function(){
  var BACKEND='https://web-production-f3794.up.railway.app';
  var slug=new URLSearchParams(location.search).get('p');
  var card=document.getElementById('card');
  if(!slug){ card.innerHTML='<div class="state">Placca non riconosciuta.</div>'; return; }
  var ICO={
    google:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20.5 12.2a8.5 8.5 0 1 1-2.5-6.1"/><path d="M12 12.2h8.5"/></svg>',
    tripadvisor:'<svg viewBox="0 0 44 26" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="15" r="7"/><circle cx="32" cy="15" r="7"/><circle cx="12" cy="15" r="2.2" fill="currentColor" stroke="none"/><circle cx="32" cy="15" r="2.2" fill="currentColor" stroke="none"/><path d="M4 8h36" stroke-linecap="round"/><path d="M22 8l-3 4M22 8l3 4" stroke-linecap="round"/></svg>',
    thefork:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v6a3 3 0 0 0 6 0V3"/><path d="M10 3v18"/><path d="M17 3c-2 2-2 6-2 8h3v10"/></svg>',
    menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>'
  };
  var NOMI={google:'Recensione su Google',tripadvisor:'Recensione su TripAdvisor',thefork:'Recensione su TheFork'};
  function lum(h){var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);return (0.299*r+0.587*g+0.114*b)/255;}
  var conta = sessionStorage.getItem('tap_'+slug) ? '0' : '1';
  fetch(BACKEND+'/api/nfc/p/'+encodeURIComponent(slug)+'?conta='+conta)
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      try{ sessionStorage.setItem('tap_'+slug,'1'); }catch(e){}
      if(d.links.length===1 && !d.menu_url){ location.replace(d.links[0].url); return; }
      document.title='Recensioni — '+d.nome_locale;
      var rs=document.documentElement.style;
      rs.setProperty('--bg', d.colore_sfondo); rs.setProperty('--ac', d.colore_primario);
      rs.setProperty('--fg', lum(d.colore_sfondo)>0.6 ? '#2b2d31' : '#f5f2ee');
      var h='<div class="frame">';
      if(d.logo_url) h+='<img class="logo" src="'+d.logo_url+'" alt="">';
      h+='<div class="nome">'+esc(d.nome_locale)+'</div><div class="sub">'+esc(d.testo||'Grazie per essere stato con noi. Lasciaci una recensione:')+'</div>';
      d.links.forEach(function(l){ h+='<a class="btn" href="'+esc(l.url)+'" rel="noopener">'+ICO[l.tipo]+'<span>'+NOMI[l.tipo]+'</span><span class="arr">&rarr;</span></a>'; });
      if(d.menu_url) h+='<a class="btn btn-menu" href="'+esc(d.menu_url)+'" rel="noopener">'+ICO.menu+'<span>Guarda il men&ugrave;</span><span class="arr">&rarr;</span></a>';
      h+='<div class="foot">Placca NFC &middot; SB Food Consulting</div></div>';
      card.innerHTML=h;
    })
    .catch(function(){ card.innerHTML='<div class="state">Placca non trovata o non ancora attiva.</div>'; });
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
})();
</script>
</body>
</html>
